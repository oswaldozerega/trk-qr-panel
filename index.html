<meta charset="utf-8">
<title>TRK QR Code Generator</title>
<meta name="description" content="Panel privado para crear, administrar y medir códigos QR estáticos y dinámicos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: glass sidebar (collapsible) + main canvas floating over soft brand-color light blobs. */
:root {
  --coral: #D2002E; --sun: #FFCD00; --sky: #A8ACAC; --petrol: #384043; --ink: #000000;
  --bg: #F1F0EC; --fg: #15191B; --muted: #5E666B; --faint: #868A90;
  --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.86); --glass-border: rgba(255,255,255,.8);
  --line: rgba(21,25,27,.10); --field: rgba(255,255,255,.78); --hover: rgba(210,0,46,.06);
  --shadow: 0 12px 32px rgba(56,64,67,.14); --shadow-sm: 0 4px 14px rgba(56,64,67,.09);
  --accent: #D2002E; --accent-fg: #FFFFFF; --accent-soft: rgba(210,0,46,.11);
  --ok: #18865B; --ok-soft: rgba(24,134,91,.13); --warn: #8A6200; --warn-soft: rgba(255,205,0,.26);
  --danger: #B3261E; --danger-soft: rgba(179,38,30,.13);
  --chart-cur: #D2002E; --chart-prev: #868A90; --hm-empty: rgba(21,25,27,.05);
  --c1: #D2002E; --c2: #384043; --c3: #E0A800; --c4: #868A90; --c5: #92001F; --c6: #2F9E74; --c7: #3887A6; --c8: #C9C6BB;
  --blob-op: .42;
  --font-display: "Barlow Condensed", "Segoe UI", system-ui, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  --sb-w: 252px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1112; --fg: #ECECE8; --muted: #A8ACAC; --faint: #767C80;
    --glass: rgba(34,39,41,.6); --glass-strong: rgba(40,46,48,.94); --glass-border: rgba(255,255,255,.08);
    --line: rgba(255,255,255,.09); --field: rgba(10,12,13,.6); --hover: rgba(255,205,0,.08);
    --shadow: 0 12px 32px rgba(0,0,0,.42); --shadow-sm: 0 4px 14px rgba(0,0,0,.3);
    --accent: #FFCD00; --accent-fg: #1A1400; --accent-soft: rgba(255,205,0,.14);
    --ok: #4FD49B; --ok-soft: rgba(79,212,155,.14); --warn: #FFD43B; --warn-soft: rgba(255,205,0,.16);
    --danger: #FF7A85; --danger-soft: rgba(255,77,106,.18);
    --chart-cur: #FFCD00; --chart-prev: #868A90; --hm-empty: rgba(255,255,255,.05);
    --c1: #FFCD00; --c2: #FF4D6A; --c3: #A8ACAC; --c4: #E0A800; --c5: #C2334F; --c6: #4FD49B; --c7: #6BC3D9; --c8: #D8D6CD;
    --blob-op: .2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1112; --fg: #ECECE8; --muted: #A8ACAC; --faint: #767C80;
    --glass: rgba(34,39,41,.6); --glass-strong: rgba(40,46,48,.94); --glass-border: rgba(255,255,255,.08);
    --line: rgba(255,255,255,.09); --field: rgba(10,12,13,.6); --hover: rgba(255,205,0,.08);
    --shadow: 0 12px 32px rgba(0,0,0,.42); --shadow-sm: 0 4px 14px rgba(0,0,0,.3);
    --accent: #FFCD00; --accent-fg: #1A1400; --accent-soft: rgba(255,205,0,.14);
    --ok: #4FD49B; --ok-soft: rgba(79,212,155,.14); --warn: #FFD43B; --warn-soft: rgba(255,205,0,.16);
    --danger: #FF7A85; --danger-soft: rgba(255,77,106,.18);
    --chart-cur: #FFCD00; --chart-prev: #868A90; --hm-empty: rgba(255,255,255,.05);
    --c1: #FFCD00; --c2: #FF4D6A; --c3: #A8ACAC; --c4: #E0A800; --c5: #C2334F; --c6: #4FD49B; --c7: #6BC3D9; --c8: #D8D6CD;
    --blob-op: .2; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.4rem, 1.1rem + 1vw, 1.85rem); font-weight: 600; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: .85em; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Background atmosphere */
.blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: var(--blob-op); }
.blob.b1 { width: 46vmax; height: 46vmax; background: var(--sky); top: -18vmax; left: -10vmax; }
.blob.b2 { width: 34vmax; height: 34vmax; background: var(--coral); top: -12vmax; right: -12vmax; opacity: calc(var(--blob-op) * .7); }
.blob.b3 { width: 38vmax; height: 38vmax; background: var(--sun); bottom: -20vmax; right: 8vmax; opacity: calc(var(--blob-op) * .75); }
.blob.b4 { width: 40vmax; height: 40vmax; background: var(--petrol); bottom: -22vmax; left: -12vmax; opacity: calc(var(--blob-op) * .8); }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); border: 1px solid var(--glass-border); box-shadow: var(--shadow); border-radius: var(--r-lg); }

/* Shell */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--sb-w) minmax(0, 1fr); min-height: 100%; transition: grid-template-columns .25s ease; }
.app.collapsed { --sb-w: 80px; }
.sidebar { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; margin: 0; border-radius: 0 var(--r-lg) var(--r-lg) 0; border-left: 0; z-index: 40; }
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px; min-height: 48px; }
.brand-logo { width: 42px; height: 42px; flex: none; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand-text strong { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: -.02em; }
.brand-text span { font-size: .74rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; background: transparent; border-radius: var(--r-md); cursor: pointer; color: var(--muted); font-weight: 600; text-align: left; white-space: nowrap; }
.nav-btn:hover { background: var(--hover); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--fg); }
.nav-btn[aria-current="page"] .ic { color: var(--accent); }
.nav-btn .ic { width: 20px; height: 20px; flex: none; }
.nav-sep { height: 1px; background: var(--line); margin: 6px 8px; }
.sb-foot { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.theme-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--hover); }
.theme-switch button { display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: transparent; padding: 7px 4px; border-radius: var(--r-sm); cursor: pointer; color: var(--muted); font-size: .76rem; font-weight: 600; }
.theme-switch button[aria-checked="true"] { background: var(--glass-strong); color: var(--fg); box-shadow: var(--shadow-sm); }
.theme-switch .ic { width: 16px; height: 16px; }
.version-tag { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px; font-size: .76rem; color: var(--muted); }
.version-tag b { font-family: var(--font-mono); font-weight: 500; color: var(--fg); }
.collapse-btn { align-self: flex-start; }
.app.collapsed .lbl { display: none; }
.app.collapsed .brand { justify-content: center; padding: 4px 0; }
.app.collapsed .nav-btn { justify-content: center; padding: 11px 0; }
.app.collapsed .theme-switch { grid-template-columns: 1fr; }
.app.collapsed .collapse-btn { align-self: center; }
.app.collapsed .collapse-btn .ic { transform: scaleX(-1); }
.app.collapsed .version-tag { justify-content: center; padding: 0; }

main { min-width: 0; padding-block: 22px 48px; padding-inline: clamp(16px, 3vw, 40px); }
.topbar { display: none; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.topbar .brand-mini { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; }
.topbar .brand-mini img { width: 32px; height: 32px; border-radius: 50%; background: #fff; }
.scrim { display: none; }

.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-head > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.page-head .lead { color: var(--muted); max-width: 62ch; }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.demo-note { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--fg); font-size: .85rem; margin-bottom: 18px; border: 1px solid transparent; }
.demo-note .ic { color: var(--warn); flex: none; margin-top: 2px; }
.demo-note > span { flex: 1 1 220px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--glass-strong); font-weight: 600; cursor: pointer; white-space: nowrap; transition: transform .12s ease, background .15s ease; }
.btn:hover { background: var(--field); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn .ic { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); border-color: transparent; }
.btn-danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn-danger:hover { background: var(--danger); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--hover); border-color: transparent; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn[disabled] { opacity: .35; cursor: not-allowed; }
.icon-btn .ic { width: 19px; height: 19px; }
.ic { width: 18px; height: 18px; display: block; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: .82rem; font-weight: 600; }
.field .req { color: var(--danger); margin-left: 2px; }
.input, select.input, textarea.input { width: 100%; padding: 9px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--field); outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
textarea.input { resize: vertical; min-height: 84px; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.help { font-size: .78rem; color: var(--muted); }
.err { font-size: .78rem; color: var(--danger); font-weight: 600; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-2 .span-2 { grid-column: 1 / -1; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--hover); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 600; font-size: .82rem; color: var(--muted); }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--glass-strong); color: var(--fg); box-shadow: var(--shadow-sm); }
.search { position: relative; flex: 1 1 220px; max-width: 340px; }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search input { padding-left: 36px; }

/* Pills & badges */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .74rem; font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.paused { background: var(--warn-soft); color: var(--warn); }
.pill.fixed { background: var(--hover); color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.badge.dyn { background: var(--accent-soft); color: var(--accent); }
.badge.sta { background: var(--hover); color: var(--muted); border: 1px dashed var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
.chip .ic { width: 15px; height: 15px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k-label { font-size: .8rem; color: var(--muted); font-weight: 600; }
.kpi .k-value { font-family: var(--font-display); font-size: 1.75rem; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .k-sub { font-size: .78rem; color: var(--muted); }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: .78rem; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--danger); }
.delta.flat { color: var(--muted); }

/* Codes table */
.panel { padding: 18px 20px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.toolbar select.input { width: auto; min-width: 150px; }
.table-wrap { overflow-x: auto; container-type: inline-size; }
/* Tabla de códigos sin scroll horizontal en el iframe de Wix: según el ancho disponible se oculta
   «Modificado» y se acorta el destino (en móvil ya pasa a tarjetas, más abajo). */
@container (max-width: 1080px) {
  .codes-table .c-mod { display: none; }
  .codes-table .dest, .codes-table .dest-link { max-width: 210px; }
  .codes-table .code-title { min-width: 190px; }
}
@container (max-width: 900px) {
  .codes-table .dest, .codes-table .dest-link { max-width: 150px; }
  .codes-table td, .codes-table th { padding-left: 8px; padding-right: 8px; }
}
@container (max-width: 760px) {
  .codes-table .c-dest { display: none; }
}
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:hover td { background: var(--hover); }
tbody tr:last-child td { border-bottom: 0; }
.qr-thumb { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; background: #fff; display: block; box-shadow: var(--shadow-sm); flex: none; }
.qr-thumb svg { width: 100%; height: 100%; display: block; }
.code-title { display: flex; align-items: center; gap: 12px; min-width: 220px; }
.code-title .t { font-weight: 700; display: block; }
.code-title .s { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 3px; }
.dest { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.dest-link { display: block; font-family: var(--font-mono); font-size: .76rem; color: var(--accent); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
.row-actions { display: flex; gap: 2px; justify-content: flex-end; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 16px; color: var(--muted); }
.empty .ic { width: 40px; height: 40px; color: var(--faint); }
.empty h3 { color: var(--fg); }

/* Popover menu */
.menu { position: fixed; z-index: 90; min-width: 220px; padding: 6px; border-radius: var(--r-md); background: var(--glass-strong); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); box-shadow: var(--shadow); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: transparent; border-radius: var(--r-sm); cursor: pointer; text-align: left; font-weight: 500; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; height: 1px; background: var(--line); margin: 4px 6px; }

/* Create view */
.create-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.create-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.create-side, .co-edit-grid > aside { align-self: stretch; }
.step-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.step-n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-family: var(--font-display); font-size: .8rem; font-weight: 700; }
.type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.type-card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--field); cursor: pointer; text-align: left; transition: border-color .15s, transform .15s; min-width: 0; }
.type-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.type-card[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.type-card .ic-wrap { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.type-card strong { font-size: .88rem; }
.type-card small { color: var(--muted); font-size: .74rem; line-height: 1.35; }
.type-card .modes { display: flex; gap: 4px; margin-top: auto; padding-top: 2px; }
.mode-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; border: 0; padding: 0; margin: 0 0 16px; }
.mode-pick legend { font-size: .82rem; font-weight: 600; margin-bottom: 8px; padding: 0; }
.mode-opt { position: relative; display: flex; gap: 10px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--field); cursor: pointer; }
.mode-opt input { margin-top: 3px; accent-color: var(--accent); }
.mode-opt strong { display: block; font-size: .88rem; }
.mode-opt span { font-size: .78rem; color: var(--muted); }
.mode-opt:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.mode-opt.disabled { opacity: .55; cursor: not-allowed; }
.form-stack { display: flex; flex-direction: column; gap: 14px; }
.list-editor { display: flex; flex-direction: column; gap: 8px; }
.list-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) auto; gap: 8px; align-items: center; }
.file-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.file-list li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--hover); font-size: .84rem; }
.file-list li span:last-child { margin-left: auto; color: var(--muted); }
.design-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.color-row { display: flex; align-items: center; gap: 8px; }
.color-row input[type="color"] { width: 42px; height: 36px; padding: 2px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--field); cursor: pointer; flex: none; }
.color-row .input { font-family: var(--font-mono); font-size: .82rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.preset { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--field); cursor: pointer; font-size: .8rem; font-weight: 600; }
.preset i { width: 20px; height: 20px; border-radius: 50%; display: block; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.preset:hover { border-color: var(--accent); }
.warn-line { display: flex; gap: 8px; align-items: flex-start; font-size: .8rem; color: var(--warn); font-weight: 600; }
.warn-line .ic { flex: none; width: 16px; height: 16px; margin-top: 2px; }

.preview-panel { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 14px; }
.qr-stage { display: grid; place-items: center; padding: 18px; border-radius: var(--r-md); background: var(--hover); }
.qr-stage .qr-box { width: 100%; max-width: 260px; aspect-ratio: 1; background: #fff; border-radius: 12px; box-shadow: var(--shadow-sm); overflow: hidden; }
.qr-stage .qr-box svg { width: 100%; height: 100%; display: block; }
.payload { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--field); border: 1px solid var(--line); min-width: 0; }
.payload code { font-family: var(--font-mono); font-size: .76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.dl-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.side-actions { display: flex; gap: 8px; }
.side-actions .btn { flex: 1; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 8px 10px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

/* Phone mock (what the person who scans sees) */
.phone { width: 100%; max-width: 260px; margin: 0 auto; border-radius: 30px; padding: 10px; background: #0E171D; box-shadow: var(--shadow); }
.phone-screen { border-radius: 22px; overflow: hidden; background: #F5F8FA; color: #15212A; min-height: 420px; display: flex; flex-direction: column; font-size: 13px; }
.phone-bar { height: 22px; display: flex; justify-content: center; align-items: center; }
.phone-bar::before { content: ""; width: 70px; height: 6px; border-radius: 6px; background: #0E171D; }
.lp-head { padding: 22px 18px 18px; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.lp-head .avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; border: 2px solid rgba(255,255,255,.6); }
.lp-head strong { font-family: var(--font-display); font-size: 1.05rem; }
.lp-head span { opacity: .85; font-size: .8rem; }
.lp-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.lp-btn { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.07); font-weight: 600; color: #15212A; overflow: hidden; }
.lp-btn .ic { width: 18px; height: 18px; flex: none; }
.lp-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lp-note { font-size: .74rem; color: #5E666B; text-align: center; padding: 6px 4px; }
.lp-text { background: #fff; border-radius: 12px; padding: 14px; white-space: pre-wrap; word-break: break-word; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.lp-foot { text-align: center; font-size: .68rem; color: #8796A1; padding: 10px; }

/* Analytics */
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 16px 18px; margin-bottom: 18px; }
.filters .field { flex: 1 1 200px; max-width: 300px; }
.range-chip { padding: 9px 12px; border-radius: var(--r-sm); background: var(--hover); font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.an-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.an-grid .wide { grid-column: 1 / -1; }
.trend { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 18px; align-items: start; }
.chart-wrap { position: relative; min-width: 0; }
.chart-wrap svg { display: block; width: 100%; overflow: visible; }
.chart-wrap .axis { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.legend-stack { display: flex; flex-direction: column; gap: 16px; }
.legend-item { display: flex; flex-direction: column; gap: 2px; }
.legend-item .lk { display: flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.legend-item .lk i { width: 10px; height: 10px; border-radius: 3px; display: block; }
.legend-item .lv { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend-item .ld { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tooltip { position: absolute; pointer-events: none; z-index: 5; padding: 8px 10px; border-radius: var(--r-sm); background: var(--glass-strong); border: 1px solid var(--glass-border); box-shadow: var(--shadow); font-size: .78rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tooltip b { font-weight: 700; }
.tooltip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.donut-wrap { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: center; }
.donut-wrap svg { width: 170px; height: 170px; display: block; }
.dev-table td, .dev-table th { padding: 8px 6px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
.heatmap { display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); gap: 3px; font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.hm-cell { position: relative; height: 15px; border-radius: 3px; background: var(--hm-empty); }
.hm-cell::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--chart-cur); opacity: var(--v, 0); }
.hm-h { text-align: right; padding-right: 6px; line-height: 15px; }
.hm-d { text-align: center; font-weight: 600; padding-top: 4px; }
.hm-legend { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 10px; font-size: .74rem; color: var(--muted); }
.hm-legend .bar { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--hm-empty), var(--chart-cur)); }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding-top: 10px; font-size: .8rem; color: var(--muted); }
.pager select { width: auto; padding: 4px 8px; }
.share-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--chart-cur); vertical-align: middle; margin-right: 8px; }

/* Reports */
.rpt-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.rpt-scroll { overflow-x: auto; padding: 20px 4px; }
.rpt-page { width: 794px; height: 1123px; margin: 0 auto 24px; position: relative; overflow: hidden; padding: 46px 52px 40px; color: #15212A; font-family: var(--font-body); font-size: 12px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.18); border-radius: 4px;
  background: radial-gradient(circle at 94% 4%, rgba(210,0,46,.20), rgba(210,0,46,0) 30%), radial-gradient(circle at 0% 42%, rgba(168,172,172,.34), rgba(168,172,172,0) 34%), radial-gradient(circle at 88% 96%, rgba(255,205,0,.30), rgba(255,205,0,0) 30%), radial-gradient(circle at 18% 104%, rgba(56,64,67,.18), rgba(56,64,67,0) 34%), #F6F5F1; }
.rpt-card { background: rgba(255,255,255,.66); border: 1px solid rgba(255,255,255,.95); border-radius: 16px; box-shadow: 0 6px 20px rgba(56,64,67,.08); padding: 16px 18px; }
.rpt-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.rpt-head .who { display: flex; align-items: center; gap: 14px; }
.rpt-head img { width: 56px; height: 56px; border-radius: 50%; background: #fff; }
.rpt-head h1 { font-size: 22px; color: #15212A; }
.rpt-head .meta { text-align: right; font-size: 11px; color: #5E666B; line-height: 1.6; }
.rpt-title-sm { font-family: var(--font-display); font-weight: 600; font-size: 13px; margin-bottom: 10px; color: #15212A; }
.rpt-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.rpt-kpis .rpt-card { padding: 12px 14px; }
.rpt-kpis .l { font-size: 10.5px; color: #5E666B; font-weight: 600; }
.rpt-kpis .v { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rpt-kpis .d { font-size: 10.5px; font-weight: 700; }
.rpt-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.rpt-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.rpt-table th { font-size: 9.5px; color: #5E666B; padding: 5px 6px; border-bottom: 1px solid rgba(21,33,42,.12); }
.rpt-table td { padding: 5px 6px; border-bottom: 1px solid rgba(21,33,42,.07); font-variant-numeric: tabular-nums; }
.rpt-table tr:last-child td { border-bottom: 0; }
.rpt-foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 10px; color: #5E666B; border-top: 1px solid rgba(21,33,42,.1); padding-top: 10px; }
.rpt-hm { display: grid; grid-template-columns: 38px repeat(7, 1fr); gap: 2px; font-size: 9px; color: #5E666B; }
.rpt-hm div.c { height: 11px; border-radius: 2px; }
.rpt-hm .h { text-align: right; padding-right: 5px; line-height: 11px; }
.rpt-hm .dname { text-align: center; font-weight: 700; }
.rpt-notes { white-space: pre-wrap; font-size: 11.5px; line-height: 1.6; }

/* Settings */
.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; font-size: .86rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatches div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .72rem; color: var(--muted); font-family: var(--font-mono); }
.swatches i { width: 44px; height: 44px; border-radius: 12px; display: block; border: 1px solid var(--line); }
.changelog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.changelog li { display: flex; flex-direction: column; gap: 6px; }
.changelog ul { margin: 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.phase-list { display: flex; flex-direction: column; gap: 10px; }
.phase { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-md); background: var(--hover); }
.phase .pill { margin-left: auto; }

/* Dialog */
dialog { border: 0; padding: 0; background: transparent; color: var(--fg); max-width: min(760px, calc(100vw - 32px)); width: 100%; }
dialog::backdrop { background: rgba(8,16,22,.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.dlg { padding: 22px; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 48px); overflow: auto; background: var(--glass-strong); }
.dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dlg-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.dlg-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 120; padding: 11px 16px; border-radius: var(--r-md); background: var(--glass-strong); border: 1px solid var(--glass-border); box-shadow: var(--shadow); font-weight: 600; display: flex; gap: 8px; align-items: center; transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { color: var(--ok); flex: none; }
.toast.error .ic { color: var(--danger); }

/* Images, companies and branded landing pages */
.btn-sm { padding: 6px 11px; font-size: .8rem; border-radius: 10px; }
.btn-sm .ic { width: 16px; height: 16px; }
fieldset.bare { border: 0; padding: 0; margin: 0; }
fieldset.bare legend { padding: 0; margin-bottom: 6px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.step-title > .ic { color: var(--accent); width: 20px; height: 20px; }
.img-pick { display: flex; gap: 12px; align-items: center; min-width: 0; }
.img-thumb { width: 72px; height: 72px; border-radius: 12px; background: var(--hover); display: grid; place-items: center; overflow: hidden; flex: none; border: 1px solid var(--line); color: var(--faint); }
.img-thumb.cover { width: 128px; }
.img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-thumb.logo img { object-fit: contain; background: #fff; padding: 4px; }
.img-actions { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.gallery-edit { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.g-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--hover); }
.g-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.g-item .icon-btn { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; background: var(--glass-strong); color: var(--fg); }
.g-add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: 10px; cursor: pointer; color: var(--muted); font-size: .76rem; font-weight: 600; text-align: center; padding: 6px; }
.g-add:hover, .g-add:focus-within { border-color: var(--accent); color: var(--accent); }
.list-row.cols-4 { grid-template-columns: minmax(150px, .9fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; }
.list-row .row-extra { grid-column: 1 / -1; }
.svc-pick { display: flex; align-items: center; gap: 6px; min-width: 0; }
.svc-dot { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; overflow: hidden; }
.svc-dot .ic { width: 16px; height: 16px; }
.svc-dot img { width: 100%; height: 100%; object-fit: cover; }
.brand-apply { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: var(--r-md); background: var(--hover); }
.co-mini { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.co-mini-logo { width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; font-size: .7rem; font-weight: 700; color: #15212A; border: 1px solid var(--line); flex: none; }
.co-mini-logo img { width: 100%; height: 100%; object-fit: contain; }
.co-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.co-card { overflow: hidden; display: flex; flex-direction: column; }
.co-cover { height: 96px; overflow: hidden; }
.co-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.co-body { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.co-body h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.co-logo { width: 64px; height: 64px; border-radius: 50%; margin-top: -32px; background: #fff; border: 3px solid var(--glass-strong); display: grid; place-items: center; overflow: hidden; font-family: var(--font-display); font-weight: 700; color: #15212A; box-shadow: var(--shadow-sm); }
.co-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.swatch-row { display: flex; gap: 4px; }
.swatch-row i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); display: block; }
.co-meta { font-size: .78rem; color: var(--muted); }
.co-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
.co-edit-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.person-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; padding: 12px; border-radius: var(--r-md); background: var(--hover); align-items: start; }
.person-card > .field .img-pick { flex-direction: column; align-items: flex-start; }
.gal-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 140px auto; gap: 8px; align-items: center; }
.gal-row img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; display: block; }

.lp { position: relative; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.lp-bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lp-bgveil { position: absolute; inset: 0; background: rgba(255,255,255,.4); }
.lp-cover, .lp-id, .lp > .lp-body { position: relative; }
.lp-cover { height: 104px; overflow: hidden; flex: none; }
.lp-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lp-id { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; padding: 0 16px 4px; margin-top: -34px; }
.lp-id.no-avatar { margin-top: 12px; }
.lp-avatar { width: 68px; height: 68px; border-radius: 50%; background: #fff; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15); overflow: hidden; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
.lp-avatar img { width: 100%; height: 100%; object-fit: cover; }
.lp-avatar.logo img { object-fit: contain; }
.lp-id strong { font-family: var(--font-display); font-size: 1.02rem; line-height: 1.25; }
.lp-id span { font-size: .76rem; opacity: .8; }
.lp-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; overflow: hidden; }
.lp-ic .ic { width: 16px; height: 16px; }
.lp-ic img { width: 100%; height: 100%; object-fit: cover; }
.lp-gallery { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.lp-gallery img { width: 118px; height: 82px; object-fit: cover; border-radius: 10px; flex: none; }
.lp-info { display: flex; gap: 6px; align-items: flex-start; font-size: .76rem; }
.lp-info .ic { width: 15px; height: 15px; flex: none; margin-top: 1px; }

/* Company profile: sizes, palettes, gradients, hours, location and grouped photos */
.img-side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.img-thumb.bg { width: 54px; height: 96px; }
.sub-title { font-family: var(--font-body); font-size: .86rem; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }
.list-row.xc-row { grid-template-columns: 44px 110px minmax(0, 1fr) auto; }
.xc-row input[type="color"], .grad-stop input[type="color"] { width: 42px; height: 36px; padding: 2px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--field); cursor: pointer; }
.grad-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 10px; }
.grad-card { padding: 12px; border-radius: var(--r-md); background: var(--hover); display: flex; flex-direction: column; gap: 8px; }
.grad-editor { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.grad-preview { height: 44px; border-radius: 10px; border: 1px solid var(--line); }
.grad-stops { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grad-stop { display: flex; align-items: center; gap: 4px; }
.grad-stop .input { width: 96px; font-family: var(--font-mono); font-size: .8rem; }
.grad-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grad-angle { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); flex: 1 1 160px; }
.grad-angle input { flex: 1; accent-color: var(--accent); }
.hours-table { display: flex; flex-direction: column; gap: 6px; }
.hours-row { display: grid; grid-template-columns: 90px 130px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 8px; border-radius: var(--r-sm); background: var(--hover); }
.hours-day { font-weight: 700; font-size: .85rem; }
.hours-ranges { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.hours-range { display: inline-flex; align-items: center; gap: 6px; }
.hours-range .input { width: auto; padding: 6px 8px; }
.hours-summary { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-md); background: var(--accent-soft); font-size: .85rem; font-weight: 600; }
.hours-summary .ic { color: var(--accent); flex: none; margin-top: 2px; }
.maps-tools { margin-top: 16px; padding: 14px; border-radius: var(--r-md); background: var(--hover); display: flex; flex-direction: column; gap: 10px; }
.steps { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
.gal-cat { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.gal-cat:last-child { border-bottom: 0; padding-bottom: 0; }
.gal-cat-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.gal-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.gal-row .cap { flex: 1 1 180px; width: auto; }

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function diffDays(a, b) { return Math.round((startOfDay(a) - startOfDay(b)) / 864e5); }
function dayKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function today() { return startOfDay(new Date()); }

function timeAgo(iso) {
  const days = diffDays(new Date(), new Date(iso));
  if (days < 1) return 'hoy';
  if (days < 30) return relFmt.format(-days, 'day');
  if (days < 365) return relFmt.format(-Math.round(days / 30), 'month');
  return relFmt.format(-Math.round(days / 365), 'year');
}

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function uid(prefix = 'qr') { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`; }
function newSlug() {
  const alphabet = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const used = new Set(state.codes.map((c) => c.slug));
  for (;;) {
    const bytes = new Uint8Array(5);
    crypto.getRandomValues(bytes);
    const slug = Array.from(bytes, (b) => alphabet[b % alphabet.length]).join('');
    if (!used.has(slug)) return slug;
  }
}
function slugify(s) { return String(s || 'codigo-qr').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'codigo-qr'; }
function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }
function fileSize(bytes) { if (!bytes) return ''; if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`; return `${(bytes / 1024 / 1024).toFixed(1).replace('.', ',')} MB`; }

function normalizeUrl(v) {

/* ───────────────────────── Persistence ───────────────────────── */

function readStorage(key) { try { return localStorage.getItem(key); } catch { return null; } }
function writeStorage(key, value) { try { localStorage.setItem(key, value); return true; } catch { return false; } }

const OZ_LOGO_REF = 'oz-logo';

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result));
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(blob);
  });
}
function dataUrlToBlob(dataUrl) {
  const [meta, b64] = String(dataUrl).split(',');
  const mime = /data:([^;]+)/.exec(meta)?.[1] || 'image/png';
  const bin = atob(b64 || '');
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

/* Clave de acceso del panel. Se guarda solo en este navegador (si se pide recordarla) y viaja en cada
   llamada; el servidor la compara con el secreto TRK_PANEL_KEY. Nunca va en el código. */
const Clave = (() => {
  const LLAVE = 'trk-qr-clave';
  let memoria = '';
  const leer = () => { try { return localStorage.getItem(LLAVE) || ''; } catch { return ''; } };
  return {
    get: () => memoria || leer(),
    set: (v, recordar) => {
      memoria = v;
      try { if (recordar) localStorage.setItem(LLAVE, v); else localStorage.removeItem(LLAVE); } catch { /* sin almacenamiento: queda en memoria */ }
    },
    clear: () => { memoria = ''; try { localStorage.removeItem(LLAVE); } catch { /* nada */ } }
  };
})();
const ES_CLAVE_INVALIDA = /clave de acceso/i;

/* Puente con Wix. El panel vive en un iframe dentro de la página privada "TRK QR Panel" del sitio;
   esa página llama a backend/panel.web.js (exige la clave de acceso) y devuelve la respuesta.
   Este código no guarda datos: todo vive en las colecciones de Wix. */
const Remoto = (() => {
  const pendientes = new Map();
  let siguiente = 1;
  const enWix = window.parent !== window;
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.oz !== 'respuesta' || !pendientes.has(m.id)) return;
    const p = pendientes.get(m.id);
    pendientes.delete(m.id);
    clearTimeout(p.reloj);
    if (m.ok) p.resolve(m.data); else p.reject(new Error(m.error || 'El servidor no pudo completar la operación.'));
  });
  function llamar(metodo, ...args) {
    if (!enWix) return Promise.reject(new Error(`Abre el panel desde ${PANEL_URL}.`));
    const id = siguiente++;
    return new Promise((resolve, reject) => {
      const reloj = setTimeout(() => { pendientes.delete(id); reject(new Error('Wix no respondió a tiempo. Revisa tu conexión y vuelve a intentarlo.')); }, 45000);
      pendientes.set(id, { resolve, reject, reloj });
      window.parent.postMessage({ oz: 'llamada', id, metodo, args, clave: Clave.get() }, '*');
    });
  }
  return { llamar, enWix };
})();

/* Imágenes y archivos: se suben a la biblioteca de medios de Wix con una URL firmada que entrega el
   servidor; los registros guardan la URL pública (static.wixstatic.com). */
const ImageStore = (() => {
  const dims = new Map();
  const api = { persistent: true };
  api.url = (ref) => {
    if (!ref) return '';
    if (ref === OZ_LOGO_REF) return LOGO;
    return /^(https:|data:image\/|blob:)/.test(String(ref)) ? String(ref) : '';
  };
  api.has = (ref) => Boolean(api.url(ref));
  api.dims = (ref) => (ref === OZ_LOGO_REF ? { w: 256, h: 256 } : dims.get(ref) || null);
  api.ids = () => [];
  api.dataUrl = async (ref) => {
    if (ref === OZ_LOGO_REF) return ozLogoDataUrl();
    const u = api.url(ref);
    if (!u) return '';
    if (u.startsWith('data:')) return u;
    const res = await fetch(u);
    return blobToDataUrl(await res.blob());
  };
  /* Sube un Blob/File a Wix y devuelve su URL pública. */
  api.put = async (blob, nombre = 'archivo') => {
    const tipo = blob.type || 'application/octet-stream';
    const { uploadUrl } = await Remoto.llamar('urlDeSubida', tipo, nombre);
    const res = await fetch(`${uploadUrl}${uploadUrl.includes('?') ? '&' : '?'}filename=${encodeURIComponent(nombre)}`, { method: 'PUT', headers: { 'Content-Type': tipo }, body: blob });
    if (!res.ok) throw new Error('Wix no aceptó el archivo.');
    const data = await res.json();
    const f = data.file || {};
    if (!f.url) throw new Error('Wix no devolvió la dirección del archivo.');
    const img = f.media && f.media.image && f.media.image.image;
    if (img && img.width) dims.set(f.url, { w: img.width, h: img.height });
    return f.url;
  };
  api.loadAll = async () => {};
  api.clear = async () => {};
  return api;
})();

/* Reduce una imagen a miniatura en data URI (formato que lee la página pública de tarjetas). */
async function miniatura(ref, maxLado, tipo) {
  const u = ImageStore.url(ref);
  if (!u) return '';
  try {
    const img = await loadImage(u);
    const s = Math.min(1, maxLado / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
    const ctx = c.getContext('2d');
    if (tipo === 'image/jpeg') { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height); }
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL(tipo, 0.82);
  } catch { return ''; }
}


const IMAGE_KINDS = {
  logo: { max: 512, type: 'image/png', round: true },
  icon: { max: 160, type: 'image/png' },
  cover: { max: 1600, type: 'image/jpeg', q: 0.82 },
  bg: { max: 1920, type: 'image/jpeg', q: 0.8 },
  photo: { max: 1200, type: 'image/jpeg', q: 0.8 }
};

/* What each image slot expects. ratio is width/height; the picker warns when an upload is far from it. */
const IMAGE_SPECS = {
  logo: { process: 'logo', thumb: 'logo', rec: '512 × 512 px', shape: 'cuadrado', ratio: 1, tip: 'PNG con fondo transparente.' },
  avatar: { process: 'logo', thumb: 'logo', rec: '512 × 512 px', shape: 'cuadrado', ratio: 1, tip: 'Logo o foto cuadrada.' },
  cover: { process: 'cover', thumb: 'cover', rec: '1600 × 600 px', shape: 'horizontal', ratio: 8 / 3, tip: 'Proporción 8:3. Se recorta arriba y abajo.' },
  bg: { process: 'bg', thumb: 'bg', rec: '1080 × 1920 px', shape: 'vertical', ratio: 9 / 16, tip: 'Como un fondo de pantalla de teléfono.' },
  person: { process: 'photo', thumb: 'photo', rec: '600 × 600 px', shape: 'cuadrada', ratio: 1, tip: 'Rostro centrado.' },
  photo: { process: 'photo', thumb: 'photo', rec: '1200 × 900 px', shape: 'horizontal', ratio: 4 / 3, tip: 'Proporción 4:3.' }
};

function orientationOf(d) {
  if (!d) return '';
  if (d.w > d.h * 1.05) return 'horizontal';
  if (d.h > d.w * 1.05) return 'vertical';
  return 'cuadrada';
}

/* Logos y avatares: quita los márgenes vacíos (transparentes o del color de las esquinas) y devuelve
   un cuadrado listo para mostrarse en círculo. Si el logo es casi cuadrado llena el círculo (se recortan
   sus esquinas); si es alargado se centra para que quepa entero dentro del círculo. */
function fitToCircle(img, ow, oh, max) {
  const a = Math.min(1, 800 / Math.max(ow, oh));
  const aw = Math.max(1, Math.round(ow * a)), ah = Math.max(1, Math.round(oh * a));
  const probe = document.createElement('canvas');
  probe.width = aw; probe.height = ah;
  const pctx = probe.getContext('2d', { willReadFrequently: true });
  pctx.drawImage(img, 0, 0, aw, ah);
  const px = pctx.getImageData(0, 0, aw, ah).data;
  const at = (x, y) => (y * aw + x) * 4;
  const corners = [at(0, 0), at(aw - 1, 0), at(0, ah - 1), at(aw - 1, ah - 1)];
  const transparent = corners.filter((i) => px[i + 3] < 32).length >= 2;
  const bg = transparent ? null : [0, 1, 2].map((k) => corners.reduce((s, i) => s + px[i + k], 0) / 4);
  const isContent = (i) => px[i + 3] >= 32 && (transparent || Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) > 60);
  let x0 = aw, y0 = ah, x1 = -1, y1 = -1;
  for (let y = 0; y < ah; y++) for (let x = 0; x < aw; x++) {
    if (isContent(at(x, y))) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = aw - 1; y1 = ah - 1; }
  const sx = x0 / a, sy = y0 / a, sw = (x1 - x0 + 1) / a, sh = (y1 - y0 + 1) / a;
  const ratio = sw / sh;
  const side = ratio > 0.8 && ratio < 1.25 ? Math.max(sw, sh) : Math.hypot(sw, sh) * 1.04;
  const scale = Math.min(1, max / side);
  const S = Math.max(1, Math.round(side * scale));
  const out = document.createElement('canvas');
  out.width = S; out.height = S;
  const ctx = out.getContext('2d');
  if (bg) { ctx.fillStyle = `rgb(${bg.map(Math.round).join(',')})`; ctx.fillRect(0, 0, S, S); }
  const dw = sw * scale, dh = sh * scale;
  ctx.drawImage(img, sx, sy, sw, sh, (S - dw) / 2, (S - dh) / 2, dw, dh);
  return out;
}

/* Downscales uploads so a phone photo (4-8 MB) becomes ~100-250 KB before it is stored. Returns the original size too. */
async function processImage(file, kind) {
  if (!file.type.startsWith('image/')) throw new Error('not-image');
  const spec = IMAGE_KINDS[kind] || IMAGE_KINDS.photo;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = url; });
    const ow = img.naturalWidth || 512, oh = img.naturalHeight || 512;
    if (spec.round) {
      const canvas = fitToCircle(img, ow, oh, spec.max);
      const blob = await new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('encode'))), spec.type, spec.q));
      return { blob, w: canvas.width, h: canvas.height, ow, oh };
    }
    const scale = Math.min(1, spec.max / Math.max(ow, oh));
    const w = Math.max(1, Math.round(ow * scale)), h = Math.max(1, Math.round(oh * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    if (spec.type === 'image/jpeg') { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h); }
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('encode'))), spec.type, spec.q));
    return { blob, w, h, ow, oh };
  } finally {
    URL.revokeObjectURL(url);
  }
}

/* "Lun a Vie 09:00–13:00, 15:00–19:00 · Sáb 09:00–13:00 · Dom cerrado". Consecutive days with the same hours are grouped. */
function hoursSummary(hours, note) {
  const extra = String(note || '').trim();
  const h = hours && typeof hours === 'object' ? hours : null;
  let text = '';
  if (h?.mode === 'always') text = 'Abierto 24/7';
  else if (h?.mode === 'appointment') text = 'Atención con cita previa';
  else if (h?.mode === 'weekly') {
    const sig = (d) => (!d || d.status === 'closed' ? 'cerrado' : d.status === '24h' ? '24 horas'
      : (d.ranges || []).filter((r) => r.from && r.to).map((r) => `${r.from}–${r.to}`).join(', ') || 'cerrado');
    const groups = [];
    for (const [key, , short] of WEEK) {
      const s = sig(h.days?.[key]);
      const last = groups[groups.length - 1];
      if (last && last.sig === s) { last.to = short; last.n += 1; } else groups.push({ sig: s, from: short, to: short, n: 1 });
    }
    text = groups.map((g) => `${g.n === 1 ? g.from : g.n === 2 ? `${g.from} y ${g.to}` : `${g.from} a ${g.to}`} ${g.sig}`).join(' · ');
  }
  return [text, extra].filter(Boolean).join('. ');
}

}

function codigoDesdeWix(c) {

  code.status = c.estado === 'paused' ? 'paused' : 'active';

/* Las tarjetas importadas del formato OZBCS solo traen los datos públicos; las nuevas traen además la ficha del panel. */
function tarjetaDesdeWix(t) {
  const o = t._origen || {};
  const base = t.nombre ? t : {
    ...emptyCard(), nombre: o.nombre || '', cargo: o.cargo || '', empresa: o.empresa || '', telefono: o.telefono || '', correo: o.correo || '',
    direccion: o.direccion || '', web: o.web || '', acento: /^#[0-9A-Fa-f]{6}$/.test(o.acento || '') ? o.acento.toUpperCase() : '#D2002E',
    foto: o.fotoMini || null, logo: o.logoMini || null, imported: true
  };
  const card = { ...emptyCard(), ...base, id: base.id || t._wixId, slugPublico: t.slugPublico, modo: base.modo || 'wix', publicada: true, _wixId: t._wixId };
  if (!card.foto && o.fotoMini) card.foto = o.fotoMini;
  if (!card.logo && o.logoMini) card.logo = o.logoMini;
  if (!card.companyId) {
    const co = state.companies.find((x) => x.name.trim().toLowerCase() === String(card.empresa).trim().toLowerCase());

}

async function guardarTarjetaRemota(card) {
  // Las imágenes heredadas (data URI) se suben a Wix para que la ficha del panel no supere el límite de tamaño.
  for (const key of ['foto', 'logo', 'fondo']) {
    if (/^data:image\//.test(card[key] || '')) {
      try { const b = dataUrlToBlob(card[key]); card[key] = await ImageStore.put(b, nombreSubida(`${card.nombre}-${key}`, b.type)); } catch { /* se conserva solo en la miniatura pública */ }
    }
  }
  const slug = cardSlug(card);
  const publica = {
    id: slug, nombre: card.nombre, cargo: card.cargo, empresa: card.empresa, telefono: card.telefono, correo: card.correo,
    direccion: card.direccion, web: card.web, acento: card.acento, idioma: pubLang(card.idioma),
    fotoMini: await miniatura(card.foto, 240, 'image/jpeg'), logoMini: await miniatura(card.logo, 200, 'image/png')
  };
  const { publicada, _wixId, ...panel } = card;
  const ligero = { ...panel, foto: /^data:/.test(card.foto || '') ? null : card.foto, logo: /^data:/.test(card.logo || '') ? null : card.logo };
  const r = await Remoto.llamar('guardarTarjeta', publica, ligero);

}

/* ───────────────────────── Payloads ───────────────────────── */

function vEsc(v) { return String(v || '').replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\r?\n/g, '\\n'); }

function buildVCard(d) {
  const lines = ['BEGIN:VCARD', 'VERSION:3.0', `N:${vEsc(d.lastName)};${vEsc(d.firstName)};;;`, `FN:${vEsc([d.firstName, d.lastName].filter(Boolean).join(' '))}`];
  if (d.org) lines.push(`ORG:${vEsc(d.org)}`);
  if (d.jobTitle) lines.push(`TITLE:${vEsc(d.jobTitle)}`);
  if (d.mobile) lines.push(`TEL;TYPE=CELL:${phoneDigits(d.mobile)}`);
  if (d.phoneWork) lines.push(`TEL;TYPE=WORK,VOICE:${phoneDigits(d.phoneWork)}`);
  if (d.email) lines.push(`EMAIL;TYPE=INTERNET:${d.email.trim()}`);
  if (d.website) lines.push(`URL:${normalizeUrl(d.website)}`);
  if (d.street || d.city || d.state || d.zip || d.country) lines.push(`ADR;TYPE=WORK:;;${vEsc(d.street)};${vEsc(d.city)};${vEsc(d.state)};${vEsc(d.zip)};${vEsc(d.country)}`);
  if (d.note) lines.push(`NOTE:${vEsc(d.note)}`);
  lines.push('END:VCARD');
  return lines.join('\r\n');
}

function mapsUrl(d) {
  if (d.lat !== '' && d.lat != null && d.lng !== '' && d.lng != null) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${d.lat},${d.lng}`)}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.address || '')}`;
}
function mailtoUrl(d) {
  const q = [];
  if (d.subject) q.push(`subject=${encodeURIComponent(d.subject)}`);
  if (d.body) q.push(`body=${encodeURIComponent(d.body)}`);
  return `mailto:${(d.to || '').trim()}${q.length ? `?${q.join('&')}` : ''}`;
}
function whatsappUrl(d) {
  const digits = phoneDigits(d.phone).replace(/\+/g, '');
  return `https://wa.me/${digits}${d.message ? `?text=${encodeURIComponent(d.message)}` : ''}`;
}

/* What a static QR carries inside the image itself. */
function staticPayload(type, d) {
  switch (type) {
    case 'url': return normalizeUrl(d.url);
    case 'text': return d.text || '';
    case 'vcard': return buildVCard(d);
    case 'maps': return mapsUrl(d);
    case 'sms': return `SMSTO:${phoneDigits(d.phone)}:${d.message || ''}`;
    case 'email': return mailtoUrl(d);
    case 'phone': return `tel:${phoneDigits(d.phone)}`;
    case 'whatsapp': return whatsappUrl(d);
    default: return '';
  }
}

function shortUrl(code) { return `https://${state.settings.shortBase}${code.slug}`; }
function qrPayload(code) { return code.mode === 'dynamic' ? shortUrl(code) : staticPayload(code.type, code.data); }

function destinationLabel(code) {
  const d = code.data || {};
  switch (code.type) {
    case 'url': return normalizeUrl(d.url).replace(/^https?:\/\//, '');
    case 'pdf': return d.file?.name || 'PDF sin archivo';
    case 'multiurl': return `${(d.links || []).filter((l) => l.url).length} enlaces · ${d.pageTitle || ''}`;
    case 'files': return `${(d.files || []).length} archivos · ${d.pageTitle || ''}`;
    case 'vcard': return [d.firstName, d.lastName].filter(Boolean).join(' ') + (d.org ? ` · ${d.org}` : '');
    case 'social': return `${(d.socials || []).filter((s) => s.url).length} redes · ${d.pageTitle || ''}`;
    case 'text': return (d.text || '').slice(0, 80);
    case 'app': return [d.iosUrl && 'App Store', d.androidUrl && 'Google Play'].filter(Boolean).join(' + ') || d.fallbackUrl || '';
    case 'maps': return d.address || `${d.lat}, ${d.lng}`;
    case 'sms': return `SMS a ${d.phone || ''}`;
    case 'email': return d.to || '';
    case 'phone': return `Llamar a ${d.phone || ''}`;
    case 'whatsapp': return `wa.me/${phoneDigits(d.phone).replace(/\+/g, '')}`;
    default: return '';
  }
}

/* ───────────────────────── QR engine ───────────────────────── */

if (window.qrcode && qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) {
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
}

class QrTooLongError extends Error {}

/* Builds a resolution-independent list of drawing operations in module units. */
function qrLayout(text, design) {
  if (!window.qrcode) throw new Error('La librería de QR no cargó. Revisa tu conexión y recarga la página.');
  const hasLogo = design.logo !== 'none';
  const ecl = hasLogo ? 'H' : design.ecl;
  const qr = qrcode(0, ecl);
  try {
    qr.addData(text || ' ', 'Byte');
    qr.make();
  } catch (e) {
    throw new QrTooLongError('El contenido es demasiado largo para un código QR.');
  }
  const n = qr.getModuleCount();
  const m = Number(design.margin) || 0;
  const total = n + 2 * m;
  const ops = [{ t: 'rect', x: 0, y: 0, w: total, h: total, r: 0, fill: design.bg }];
  const inFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  let logo = null;
  if (hasLogo) {
    const s = Math.max(5, Math.floor(n * 0.24));
    const start = Math.floor((n - s) / 2);
    logo = { start, s };
  }
  const inLogo = (r, c) => logo && r >= logo.start && r < logo.start + logo.s && c >= logo.start && c < logo.start + logo.s;

  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (!qr.isDark(r, c) || inFinder(r, c) || inLogo(r, c)) continue;
      const x = c + m, y = r + m;
      if (design.dot === 'dots') ops.push({ t: 'circle', cx: x + 0.5, cy: y + 0.5, r: 0.43, fill: design.fg });
      else if (design.dot === 'rounded') ops.push({ t: 'rect', x: x + 0.06, y: y + 0.06, w: 0.88, h: 0.88, r: 0.3, fill: design.fg });
      else ops.push({ t: 'rect', x, y, w: 1, h: 1, r: 0, fill: design.fg });
    }
  }

  for (const [fr, fc] of [[0, 0], [0, n - 7], [n - 7, 0]]) {
    const x = fc + m, y = fr + m;
    if (design.eyeStyle === 'circle') {
      ops.push({ t: 'circle', cx: x + 3.5, cy: y + 3.5, r: 3.5, fill: design.eye });
      ops.push({ t: 'circle', cx: x + 3.5, cy: y + 3.5, r: 2.5, fill: design.bg });
      ops.push({ t: 'circle', cx: x + 3.5, cy: y + 3.5, r: 1.5, fill: design.eye });
    } else {
      const rounded = design.eyeStyle === 'rounded';
      ops.push({ t: 'rect', x, y, w: 7, h: 7, r: rounded ? 2 : 0, fill: design.eye });
      ops.push({ t: 'rect', x: x + 1, y: y + 1, w: 5, h: 5, r: rounded ? 1.4 : 0, fill: design.bg });
      ops.push({ t: 'rect', x: x + 2, y: y + 2, w: 3, h: 3, r: rounded ? 0.9 : 0, fill: design.eye });
    }
  }

  if (logo) {
    const href = design.logo === 'custom' && design.logoData ? blobUrlFor(design.logoData)
      : design.logo === 'company' && design.logoRef ? (ImageStore.url(design.logoRef) || LOGO) : LOGO;
    ops.push({ t: 'rect', x: logo.start + m, y: logo.start + m, w: logo.s, h: logo.s, r: logo.s * 0.22, fill: design.bg });
    ops.push({ t: 'image', x: logo.start + m + 0.6, y: logo.start + m + 0.6, w: logo.s - 1.2, h: logo.s - 1.2, href });
  }
  return { ops, total, modules: n, ecl };
}

function layoutToSVG(L, size) {
  const f = (v) => +v.toFixed(3);
  const body = L.ops.map((o) => {
    if (o.t === 'rect') return o.r === 0
      ? `<rect x="${f(o.x)}" y="${f(o.y)}" width="${f(o.w)}" height="${f(o.h)}" fill="${o.fill}" shape-rendering="crispEdges"/>`
      : `<rect x="${f(o.x)}" y="${f(o.y)}" width="${f(o.w)}" height="${f(o.h)}" rx="${f(o.r)}" fill="${o.fill}"/>`;
    if (o.t === 'circle') return `<circle cx="${f(o.cx)}" cy="${f(o.cy)}" r="${f(o.r)}" fill="${o.fill}"/>`;
    if (o.t === 'image') return `<image href="${o.href}" x="${f(o.x)}" y="${f(o.y)}" width="${f(o.w)}" height="${f(o.h)}" preserveAspectRatio="xMidYMid meet"/>`;
    return '';
  }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${L.total} ${L.total}" width="${size}" height="${size}">${body}</svg>`;
}

const imageCache = new Map();
function loadImage(src) {
  if (imageCache.has(src)) return imageCache.get(src);
  const p = new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('No se pudo cargar el logo.'));
    if (/^https?:/.test(src)) img.crossOrigin = 'anonymous';
    img.src = src;
  });
  imageCache.set(src, p);
  return p;
}

function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

async function layoutToCanvas(L, size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const s = size / L.total;
  for (const o of L.ops) {
    if (o.t === 'rect') {
      ctx.fillStyle = o.fill;
      if (o.r === 0) {
        /* Snap square modules to whole pixels so neighbouring modules never show seams. */
        const x0 = Math.round(o.x * s), y0 = Math.round(o.y * s);
        ctx.fillRect(x0, y0, Math.round((o.x + o.w) * s) - x0, Math.round((o.y + o.h) * s) - y0);
      } else {
        roundRectPath(ctx, o.x * s, o.y * s, o.w * s, o.h * s, o.r * s);
        ctx.fill();
      }
    } else if (o.t === 'circle') {
      ctx.fillStyle = o.fill;
      ctx.beginPath();
      ctx.arc(o.cx * s, o.cy * s, o.r * s, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.t === 'image') {
      const img = await loadImage(o.href);
      const box = o.w * s;
      const ratio = Math.min(box / img.width, box / img.height);
      const w = img.width * ratio, h = img.height * ratio;
      ctx.drawImage(img, o.x * s + (box - w) / 2, o.y * s + (box - h) / 2, w, h);
    }
  }
  return canvas;
}

const thumbCache = new Map();
function qrSVG(code, size) {
  const payload = qrPayload(code);
  const key = `${size}|${payload}|${JSON.stringify(code.design)}`;
  if (thumbCache.has(key)) return thumbCache.get(key);
  let svg;
  try { svg = layoutToSVG(qrLayout(payload, code.design), size); }
  catch { svg = `<svg viewBox="0 0 10 10" width="${size}" height="${size}"><rect width="10" height="10" fill="#eee"/></svg>`; }
  thumbCache.set(key, svg);
  return svg;
}

/* GIF89a encoder (LZW, 256-colour global table). Exact colours when the image has 256 or fewer, otherwise RGB 3-3-2 quantization. */
function lzwEncode(indices, minCodeSize) {
  const clear = 1 << minCodeSize, eoi = clear + 1;
  let codeSize = minCodeSize + 1, next = eoi + 1;
  let table = new Map();
  const bytes = [];
  let cur = 0, bits = 0;
  const emit = (code) => {
    cur |= code << bits; bits += codeSize;
    while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; }
  };
  emit(clear);
  let prefix = indices[0];
  for (let i = 1; i < indices.length; i++) {
    const k = indices[i];
    const key = (prefix << 8) | k;
    const found = table.get(key);
    if (found !== undefined) { prefix = found; continue; }
    emit(prefix);
    if (next === 4096) {
      emit(clear);
      table = new Map(); codeSize = minCodeSize + 1; next = eoi + 1;
    } else {
      if (next >= (1 << codeSize)) codeSize++;
      table.set(key, next++);
    }
    prefix = k;
  }
  emit(prefix);
  emit(eoi);
  if (bits > 0) bytes.push(cur & 255);
  return bytes;
}

function encodeGIF(imageData) {
  const { width: w, height: h, data } = imageData;
  const idx = new Uint8Array(w * h);
  const palette = [];
  const lookup = new Map();
  let exact = true;
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    const key = (data[i] << 16) | (data[i + 1] << 8) | data[i + 2];
    let k = lookup.get(key);
    if (k === undefined) {
      if (palette.length >= 256) { exact = false; break; }
      k = palette.length; palette.push(key); lookup.set(key, k);
    }
    idx[p] = k;
  }
  if (!exact) {
    palette.length = 0;
    for (let r = 0; r < 8; r++) for (let g = 0; g < 8; g++) for (let b = 0; b < 4; b++) {
      palette.push((Math.round(r * 255 / 7) << 16) | (Math.round(g * 255 / 7) << 8) | Math.round(b * 255 / 3));
    }
    for (let i = 0, p = 0; i < data.length; i += 4, p++) idx[p] = ((data[i] >> 5) << 5) | ((data[i + 1] >> 5) << 2) | (data[i + 2] >> 6);
  }
  while (palette.length < 256) palette.push(0);
  const head = [];
  const str = (s) => { for (let i = 0; i < s.length; i++) head.push(s.charCodeAt(i)); };
  const u16 = (v) => head.push(v & 255, (v >> 8) & 255);
  str('GIF89a'); u16(w); u16(h); head.push(0xF7, 0, 0);
  for (const c of palette) head.push((c >> 16) & 255, (c >> 8) & 255, c & 255);
  head.push(0x2C); u16(0); u16(0); u16(w); u16(h); head.push(0, 8);
  const lzw = lzwEncode(idx, 8);
  const blocks = [];
  for (let i = 0; i < lzw.length; i += 255) {
    const chunk = lzw.slice(i, i + 255);
    blocks.push(chunk.length, ...chunk);
  }
  return new Uint8Array([...head, ...blocks, 0, 0x3B]);
}

/* The artifact viewer blocks data: images on screen, so the page shows logos via file or blob: URLs
   and only inlines them as data: URIs inside exported SVG files, which must be self-contained. */
const blobUrls = new Map();
function blobUrlFor(dataUrl) {
  if (blobUrls.has(dataUrl)) return blobUrls.get(dataUrl);
  try {
    const [meta, b64] = dataUrl.split(',');
    const mime = /data:([^;]+)/.exec(meta)?.[1] || 'image/png';
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    blobUrls.set(dataUrl, url);
    return url;
  } catch { return LOGO; }
}

let logoDataPromise = null;
function ozLogoDataUrl() {
  if (!logoDataPromise) {
    logoDataPromise = fetch(LOGO).then((r) => r.blob()).then((b) => new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result));
      fr.onerror = reject;
      fr.readAsDataURL(b);
    })).catch(() => LOGO);
  }
  return logoDataPromise;
}

async function renderExport(code, format, size) {
  const L = qrLayout(qrPayload(code), code.design);
  if (format === 'svg') {
    const img = L.ops.find((o) => o.t === 'image');
    if (img) img.href = code.design.logo === 'custom' && code.design.logoData ? code.design.logoData
      : code.design.logo === 'company' && code.design.logoRef ? (await ImageStore.dataUrl(code.design.logoRef)) || (await ozLogoDataUrl()) : await ozLogoDataUrl();
  }
  if (format === 'svg') return new Blob([`<?xml version="1.0" encoding="UTF-8"?>\n${layoutToSVG(L, size)}`], { type: 'image/svg+xml' });
  const canvas = await layoutToCanvas(L, size);
  if (format === 'gif') {
    const data = canvas.getContext('2d').getImageData(0, 0, size, size);
    return new Blob([encodeGIF(data)], { type: 'image/gif' });
  }
  const mime = format === 'jpg' ? 'image/jpeg' : 'image/png';
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('No se pudo generar la imagen.'))), mime, 0.95));
}

let downloadsApi;          // undefined: not resolved yet; null: unavailable
const inViewer = typeof window.claude?.use === 'function';
if (inViewer) {
  window.claude.use('downloads').then((api) => { downloadsApi = api; }).catch(() => { downloadsApi = null; });
}

async function saveFile(filename, blob) {
  if (downloadsApi) {
    try {
      await downloadsApi.save({ filename, data: blob });
      toast(`Listo: ${filename}`);
    } catch (e) {
      if (e?.code === 'declined') return;
      if (e?.code === 'rate_limited') { toast('Ya hay una descarga esperando tu confirmación.', 'error'); return; }
      showFallbackSave(filename, blob);
    }
    return;
  }
  if (!inViewer) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`Descargado: ${filename}`);
    return;
  }
  showFallbackSave(filename, blob);
}

function showFallbackSave(filename, blob) {
  const url = URL.createObjectURL(blob);
  const isImage = blob.type.startsWith('image/');
  openDialog(`
    <div class="dlg-head"><div><p class="eyebrow">Descarga</p><h2 id="dlg-title">${esc(filename)}</h2></div>
