    <p class="muted">Esta vista no permite descargar archivos directamente. ${isImage ? 'Haz clic derecho en la imagen y elige <b>Guardar imagen como…</b>' : 'Abre el panel en tu navegador para descargar este archivo.'}</p>
    ${isImage ? `<div class="qr-stage"><img src="${url}" alt="Vista previa de ${esc(filename)}" style="max-width:320px;width:100%;background:#fff;border-radius:12px"></div>` : ''}
    <div class="dlg-foot"><button class="btn" data-action="close-dialog">Cerrar</button></div>`);
}

/* ───────────────────────── Demo analytics ───────────────────────── */

const scanCache = new Map();
const weightCache = new Map();

function isPausedOn(code, date) {
  return (code.pauses || []).some((p) => {
    const from = startOfDay(new Date(p.from));
    const to = p.to ? startOfDay(new Date(p.to)) : null;
    return date >= from && (!to || date < to);
  });
}

function demoScans(code, date) {
  if (!code.demo || code.mode !== 'dynamic' || !code.baseRate) return 0;
  if (date < startOfDay(new Date(code.createdAt)) || date > today() || isPausedOn(code, date)) return 0;
  const r = rng(hashStr(code.id + dayKey(date)))();
  const season = 1 + 0.12 * Math.sin(date.getTime() / 864e5 / 58);
  return Math.round(code.baseRate * WEEKDAY_FACTOR[date.getDay()] * season * (0.74 + 0.52 * r));
}

function weightsFor(code) {
  if (weightCache.has(code.id)) return weightCache.get(code.id);
  const r = rng(hashStr(`${code.id}:weights`));
  const norm = (arr) => { const s = arr.reduce((a, b) => a + b.w, 0); return arr.map((x) => ({ ...x, w: x.w / s })); };
  const countries = norm(GEO.map((g) => ({ ...g, w: g.w * (0.6 + 0.8 * r()) })));
  const devices = norm(DEVICES.map(([name, w]) => ({ name, w: w * (0.8 + 0.4 * r()) })));
  const hs = HOUR_WEIGHTS.reduce((a, b) => a + b, 0);
  const W = { countries, devices, hours: HOUR_WEIGHTS.map((h) => h / hs) };
  weightCache.set(code.id, W);
  return W;
}

function eventsFor(codeId) { return state.events.filter((e) => e.codeId === codeId); }

function totalScans(code) {
  if (code.mode !== 'dynamic') return null;
  if (scanCache.has(code.id)) return scanCache.get(code.id);
  let total = Math.max(eventsFor(code.id).length, Number(state.scanTotals?.[code.slug]) || 0);
  if (code.demo) {
    const end = today();
    for (let d = startOfDay(new Date(code.createdAt)); d <= end; d = addDays(d, 1)) total += demoScans(code, d);
  }
  scanCache.set(code.id, total);
  return total;
}

function computeAnalytics(codes, days, endDate = today()) {
  const start = addDays(endDate, -(days - 1));
  const pstart = addDays(start, -days);
  const zeros = () => new Array(days).fill(0);
  const res = { days, start, end: endDate, pstart, labels: [], cur: zeros(), prev: zeros(), curU: zeros(), prevU: zeros(),
    countries: new Map(), cities: new Map(), devices: new Map(), heat: Array.from({ length: 7 }, () => new Array(24).fill(0)), perCode: [] };
  for (let i = 0; i < days; i++) res.labels.push(addDays(start, i));
  const add = (map, key, v, extra) => { const e = map.get(key) || { ...extra, v: 0 }; e.v += v; map.set(key, e); };
  // Usuario único = mismo teléfono el mismo día (el servidor guarda un identificador anónimo que cambia cada día).
  const vistos = new Set();
  const esNuevo = (periodo, dia, ev) => { if (!ev.visitor) return true; const k = `${periodo}|${dia}|${ev.visitor}`; if (vistos.has(k)) return false; vistos.add(k); return true; };

  for (const code of codes) {
    if (code.mode !== 'dynamic') continue;
    const W = weightsFor(code);
    let cur = 0, prev = 0, demoCur = 0;
    for (let i = 0; i < days; i++) {
      const d = res.labels[i];
      const n = demoScans(code, d);
      if (n) {
        res.cur[i] += n; res.curU[i] += n * UNIQUE_RATIO; demoCur += n;
        const row = res.heat[d.getDay()];
        for (let h = 0; h < 24; h++) row[h] += n * W.hours[h];
      }
      const pn = demoScans(code, addDays(pstart, i));
      res.prev[i] += pn; res.prevU[i] += pn * UNIQUE_RATIO; prev += pn;
    }
    cur += demoCur;
    for (const g of W.countries) {
      const cv = demoCur * g.w;
      add(res.countries, g.country, cv, { name: g.country });
      for (const [city, region, cw] of g.cities) add(res.cities, `${city}|${g.country}`, cv * cw, { city, region, country: g.country });
    }
    for (const dv of W.devices) add(res.devices, dv.name, demoCur * dv.w, { name: dv.name });

    for (const ev of eventsFor(code.id)) {
      const when = new Date(ev.ts);
      const i = diffDays(when, start);
      if (i >= 0 && i < days) {
        res.cur[i] += 1; if (esNuevo('c', i, ev)) res.curU[i] += 1; cur += 1;
        res.heat[when.getDay()][when.getHours()] += 1;
        add(res.countries, ev.country, 1, { name: ev.country });
        add(res.cities, `${ev.city}|${ev.country}`, 1, { city: ev.city, region: ev.region, country: ev.country });
        add(res.devices, ev.device, 1, { name: ev.device });
      } else {
        const j = diffDays(when, pstart);
        if (j >= 0 && j < days) { res.prev[j] += 1; if (esNuevo('p', j, ev)) res.prevU[j] += 1; prev += 1; }
      }
    }
    res.perCode.push({ code, cur, prev });
  }
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  res.total = sum(res.cur); res.totalPrev = sum(res.prev);
  res.unique = sum(res.curU); res.uniquePrev = sum(res.prevU);
  const sorted = (map) => Array.from(map.values()).filter((x) => x.v >= 0.5).sort((a, b) => b.v - a.v);
  res.countryList = sorted(res.countries);
  res.cityList = sorted(res.cities);
  res.deviceList = sorted(res.devices);
  res.perCode.sort((a, b) => b.cur - a.cur);
  return res;
}

function deltaInfo(cur, prev) {
  if (!prev) return { cls: 'flat', text: cur ? 'nuevo' : 'sin cambios', arrow: '' };
  const p = (cur - prev) / prev;
  if (Math.abs(p) < 0.005) return { cls: 'flat', text: '0%', arrow: '→' };
  return { cls: p > 0 ? 'up' : 'down', text: `${Math.abs(p * 100).toFixed(0)}%`, arrow: p > 0 ? '↑' : '↓' };
}
function deltaHTML(cur, prev) {
  const d = deltaInfo(cur, prev);
  return `<span class="delta ${d.cls}">${d.arrow}${d.text}</span>`;
}

function targetCodes(target) {
  const dyn = state.codes.filter((c) => c.mode === 'dynamic');
  if (target === 'all') return dyn;
  if (target.startsWith('client:')) return dyn.filter((c) => c.client === target.slice(7));
  if (target.startsWith('code:')) return dyn.filter((c) => c.id === target.slice(5));
  return dyn;
}
function targetLabel(target) {
  if (target === 'all') return 'Todos los códigos dinámicos';
  if (target.startsWith('client:')) return `Cliente: ${target.slice(7)}`;
  const c = state.codes.find((x) => x.id === target.slice(5));
  return c ? c.title : 'Código';
}
function clients() { return Array.from(new Set(state.codes.map((c) => c.client).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'es')); }

/* Buckets daily series into weeks for long periods so bars stay readable. */
function bucketSeries(a) {
  if (a.days <= 92) return { labels: a.labels.map((d) => dayFmt.format(d)), full: a.labels.map((d) => dateFmt.format(d)), cur: a.cur, prev: a.prev, unit: 'día' };
  const labels = [], full = [], cur = [], prev = [];
  for (let i = 0; i < a.days; i += 7) {
    const end = Math.min(i + 7, a.days);
    labels.push(dayFmt.format(a.labels[i]));
    full.push(`Semana del ${dateFmt.format(a.labels[i])}`);
    cur.push(a.cur.slice(i, end).reduce((x, y) => x + y, 0));
    prev.push(a.prev.slice(i, end).reduce((x, y) => x + y, 0));
  }
  return { labels, full, cur, prev, unit: 'semana' };
}

/* ───────────────────────── Charts ───────────────────────── */

function niceMax(v) {
  if (v <= 0) return 4;
  const pow = 10 ** Math.floor(Math.log10(v));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * pow >= v) return m * pow;
  return 10 * pow;
}

function trendSVG(series, opts) {
  const { width, height = 260, mode = 'bar', pal } = opts;
  const pad = { l: 44, r: 10, t: 12, b: 34 };
  const iw = Math.max(width - pad.l - pad.r, 50), ih = height - pad.t - pad.b;
  const n = series.cur.length;
  const max = niceMax(Math.max(1, ...series.cur, ...series.prev));
  const y = (v) => pad.t + ih - (v / max) * ih;
  const band = iw / n;
  const parts = [];
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k, yy = y(v);
    parts.push(`<line x1="${pad.l}" x2="${pad.l + iw}" y1="${yy}" y2="${yy}" stroke="${pal.grid}" stroke-width="1"/>`);
    parts.push(`<text x="${pad.l - 8}" y="${yy + 4}" text-anchor="end" fill="${pal.text}" font-size="11">${fmtN(v)}</text>`);
  }
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 58))));
  for (let i = 0; i < n; i += every) {
    parts.push(`<text x="${pad.l + band * i + band / 2}" y="${height - 12}" text-anchor="middle" fill="${pal.text}" font-size="11">${esc(series.labels[i])}</text>`);
  }
  if (mode === 'bar') {
    const bw = Math.max(1, band * 0.36);
    for (let i = 0; i < n; i++) {
      const x0 = pad.l + band * i + band * 0.12;
      const hc = Math.max(0, pad.t + ih - y(series.cur[i])), hp = Math.max(0, pad.t + ih - y(series.prev[i]));
      parts.push(`<rect x="${x0}" y="${pad.t + ih - hp}" width="${bw}" height="${hp}" rx="${Math.min(2, bw / 2)}" fill="${pal.prev}"/>`);
      parts.push(`<rect x="${x0 + bw + band * 0.04}" y="${pad.t + ih - hc}" width="${bw}" height="${hc}" rx="${Math.min(2, bw / 2)}" fill="${pal.cur}"/>`);
    }
  } else {
    const pt = (arr, i) => `${pad.l + band * i + band / 2},${y(arr[i])}`;
    const curPts = series.cur.map((_, i) => pt(series.cur, i)).join(' ');
    const prevPts = series.prev.map((_, i) => pt(series.prev, i)).join(' ');
    parts.push(`<polygon points="${pad.l + band / 2},${pad.t + ih} ${curPts} ${pad.l + band * (n - 1) + band / 2},${pad.t + ih}" fill="${pal.cur}" fill-opacity="0.12"/>`);
    parts.push(`<polyline points="${prevPts}" fill="none" stroke="${pal.prev}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`);
    parts.push(`<polyline points="${curPts}" fill="none" stroke="${pal.cur}" stroke-width="2.4" stroke-linejoin="round"/>`);
    const last = n - 1;
    parts.push(`<circle cx="${pad.l + band * last + band / 2}" cy="${y(series.cur[last])}" r="4.5" fill="${pal.cur}" stroke="${pal.bg}" stroke-width="2"/>`);
  }
  if (opts.interactive) {
    for (let i = 0; i < n; i++) parts.push(`<rect data-i="${i}" x="${pad.l + band * i}" y="${pad.t}" width="${band}" height="${ih}" fill="transparent"/>`);
  }
  parts.push(`<line x1="${pad.l}" x2="${pad.l + iw}" y1="${pad.t + ih}" y2="${pad.t + ih}" stroke="${pal.axis}" stroke-width="1"/>`);
  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="${esc(opts.label || 'Escaneos por periodo')}">${parts.join('')}</svg>`;
}

function donutSVG(items, colors, size = 170) {
  const total = items.reduce((a, b) => a + b.v, 0) || 1;
  const r = 62, c = 2 * Math.PI * r;
  let offset = 0;
  const segs = items.map((it, i) => {
    const len = (it.v / total) * c;
    const gap = items.length > 1 ? Math.min(2, len * 0.3) : 0;
    const s = `<circle cx="85" cy="85" r="${r}" fill="none" stroke="${colors[i % colors.length]}" stroke-width="26" stroke-dasharray="${Math.max(0, len - gap)} ${c}" stroke-dashoffset="${-offset}" transform="rotate(-90 85 85)"><title>${esc(it.name)}: ${fmtN(it.v)}</title></circle>`;
    offset += len;
    return s;
  });
  return `<svg viewBox="0 0 170 170" width="${size}" height="${size}" role="img" aria-label="Escaneos por dispositivo">${segs.join('')}</svg>`;
}

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function categorical() { return ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7', '--c8'].map(cssVar); }

const BTN_RADIUS = { rounded: '12px', pill: '999px', square: '4px' };

function hasLanding(code) { return PAGE_TYPES.includes(code.type) && code.mode === 'dynamic'; }
function pageOf(code) {
  const p = { ...DEFAULT_PAGE, ...(code.page || {}) };
  if (!p.bgGradient) p.bgGradient = { type: 'linear', angle: 165, colors: [p.bgColor, p.bgColor2] };
  if (!p.coverGradient) p.coverGradient = { type: 'linear', angle: 135, colors: [p.primary, p.bgColor2] };
  return p;
}
function newGradient(colors) { return { name: '', type: 'linear', angle: 135, colors: colors.slice(0, 3) }; }
function serviceById(id) { return SERVICES.find((s) => s.id === id) || SERVICES[0]; }
function findCompany(id) { return (state.companies || []).find((c) => c.id === id) || null; }
function draftCompany() { return draft?.companyId ? findCompany(draft.companyId) : null; }
function pickDefined(o) { const r = {}; for (const [k, v] of Object.entries(o)) if (v !== undefined && v !== null && v !== '') r[k] = v; return r; }
function hexA(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return `rgba(56,135,166,${a})`;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function readableOn(hex) { return luminance(hex) > 0.45 ? '#15212A' : '#FFFFFF'; }

/* Paths address editable state: "draft.page.avatar", "draft.data.links.2.iconImg", "co.people.0.photo". */
function resolvePath(path) {
  const [scope, ...keys] = path.split('.');
  return { root: scope === 'co' ? coDraft : draft, keys };
}
function getPath(path) {
  const { root, keys } = resolvePath(path);
  return keys.reduce((o, k) => (o == null ? undefined : o[k]), root);
}
function setPath(path, value) {
  const { root, keys } = resolvePath(path);
  if (!root) return;
  let o = root;
  for (let i = 0; i < keys.length - 1; i++) {
    if (o[keys[i]] == null) o[keys[i]] = {};
    o = o[keys[i]];
  }
  o[keys[keys.length - 1]] = value;
}

function emptyData(type) {
  if (type === 'multiurl') return { links: [{ icon: 'web', label: '', url: '' }, { icon: 'instagram', label: '', url: '' }] };
  if (type === 'social') return { socials: [{ network: 'instagram', label: '', url: '' }, { network: 'facebook', label: '', url: '' }] };
  if (type === 'files') return { files: [] };
  return {};
}

function startDraft(code, type, companyId) {
  draftErrors = {};
  previewTab = 'qr';
  previewTest = false;
  if (code) {
    editingId = code.id;
    draft = clone(code);
    draft.lang = pubLang(draft.lang);
    draft.page = pageOf(draft);
    return;
  }
  editingId = null;
  const t = typeById(type || 'url');
  draft = { id: uid(), slug: newSlug(), title: '', client: '', companyId: null, personId: null, type: t.id, mode: t.modes[0], status: 'active', pauses: [],
    lang: 'en', data: emptyData(t.id), page: pageOf({ page: { gallery: [] } }), design: { ...DEFAULT_DESIGN } };

/* The fields a QR of `type` takes from a company record. Pure: used by the QR form and the company preview. */
function companyData(co, type) {
  const d = {};
  const addr = fullAddress(co);
  const socials = (co.socials || []).filter((s) => s.url);
  const hours = hoursSummary(co.hours, co.hoursNote);
  switch (type) {
    case 'url': if (co.website) d.url = co.website; break;
    case 'vcard': Object.assign(d, pickDefined({ org: co.name, website: co.website, email: co.email, phoneWork: co.phone,
      street: [co.address, co.number].filter(Boolean).join(' '), city: co.city, state: co.state, country: co.country })); break;
    case 'social':
      d.pageTitle = co.name;
      if (co.industry) d.bio = co.industry;
      if (socials.length) d.socials = socials.map((s) => ({ network: s.network, label: s.label || '', url: s.url }));
      break;
    case 'multiurl': {
      d.pageTitle = co.name;
      const links = [];
      if (co.website) links.push({ icon: 'web', label: pubTxt(draft?.lang).website, url: co.website });
      for (const s of socials) links.push({ icon: s.network, label: s.label || serviceById(s.network).label, url: s.url });
      if (co.whatsapp) links.push({ icon: 'whatsapp', label: pubTxt(draft?.lang).whatsapp, url: whatsappUrl({ phone: co.whatsapp }) });
      if (addr) links.push({ icon: 'maps', label: pubTxt(draft?.lang).directions, url: mapsUrl({ address: addr, lat: co.lat, lng: co.lng }) });
      if (links.length) d.links = links;
      break;
    }
    case 'app':
      Object.assign(d, pickDefined({ appName: co.name, iosUrl: co.apps?.ios, androidUrl: co.apps?.android, fallbackUrl: co.website }));
      break;
    case 'maps': Object.assign(d, pickDefined({ placeName: co.name, address: addr, lat: co.lat, lng: co.lng, hours, phone: co.phone || co.mobile,
      reference: co.reference, parking: [parkingLabel(co.parking), co.parkingNote].filter(Boolean).join('. ') })); break;
    case 'sms': case 'phone': if (co.mobile || co.phone) d.phone = co.mobile || co.phone; break;
    case 'whatsapp': if (co.whatsapp) d.phone = co.whatsapp; break;
    case 'email': if (co.email) d.to = co.email; break;
    case 'pdf': d.pdfTitle = co.name; break;
    case 'files': d.pageTitle = co.name; break;
    case 'text': d.text = [co.name, hours && `Horario: ${hours}`, addr && `Dirección: ${addr}`].filter(Boolean).join('\n'); break;
    default: break;
  }
  return d;
}

/* The landing-page look a company implies: logo, cover, palette, first gradient and venue photos. */
function brandPage(co, type, current = DEFAULT_PAGE) {
  const c = { ...DEFAULT_COLORS, ...(co.colors || {}) };
  const g = (co.gradients || [])[0];
  const page = { ...pageOf({ page: current }), avatar: co.logo || null, cover: co.cover || null, primary: c.primary, textColor: c.text,
    bgType: 'color', bgColor: c.background, btnBg: '#FFFFFF', btnText: c.text,
    coverType: g ? 'gradient' : 'color', coverGradient: g ? clone(g) : { type: 'linear', angle: 135, colors: [c.primary, c.secondary] } };
  if (type === 'maps') {
    const local = (co.gallery || []).filter((x) => x.category === 'local');
    const ordered = [...local.filter((x) => x.sub === 'fachada'), ...local.filter((x) => x.sub !== 'fachada')];
    if (ordered.length && !(current.gallery || []).length) page.gallery = ordered.map((x) => x.img).slice(0, 8);
  }
  return page;
}

/* Fills the current type's fields from the company record. Called on company pick and on type switch. */
function applyCompany(co, opts = {}) {
  draft.companyId = co.id;
  draft.client = co.name;
  const fill = companyData(co, draft.type);
  if (draft.type === 'pdf' || draft.type === 'files' || draft.type === 'app') {
    for (const [k, v] of Object.entries(fill)) if (!draft.data[k] || ['iosUrl', 'androidUrl', 'fallbackUrl'].includes(k)) draft.data[k] = v;
  } else {
    Object.assign(draft.data, fill);
  }
  if (opts.brand) applyBrand(co);
}

function applyBrand(co) {
  const c = { ...DEFAULT_COLORS, ...(co.colors || {}) };
  draft.page = brandPage(co, draft.type, pageOf(draft));
  draft.design.eye = c.primary;
  if (contrastRatio(c.text, draft.design.bg) >= 4) draft.design.fg = c.text;
}

function applyPerson(co, personId) {
  draft.personId = personId || null;
  const p = (co?.people || []).find((x) => x.id === personId);
  if (!p) return;
  Object.assign(draft.data, pickDefined({ firstName: p.firstName, lastName: p.lastName, jobTitle: p.jobTitle, email: p.email, mobile: p.phone || p.whatsapp }));
  if (p.photo) draft.page = { ...pageOf(draft), avatar: p.photo };
}

function typeFieldsHTML() {
  const t = typeById(draft.type);
  return t.fields.map((f) => fieldHTML(f, draft.data[f.k], draftErrors[f.k])).join('');
}

function modePicker(t) {
  const opt = (mode, title, text) => {
    const allowed = t.modes.includes(mode);
    const reason = mode === 'static' ? 'Este tipo necesita una página o archivo en tu servidor.' : 'Este tipo se guarda completo dentro del código.';
    return `<label class="mode-opt ${allowed ? '' : 'disabled'}">
      <input type="radio" name="mode" value="${mode}" ${draft.mode === mode ? 'checked' : ''} ${allowed ? '' : 'disabled'}>
      <div><strong>${title}</strong><span>${allowed ? text : reason}</span></div></label>`;
  };
  return `<fieldset class="mode-pick"><legend>Tipo de QR</legend>
    ${opt('dynamic', 'Dinámico', 'Pasa por theroofingknight.com: mide escaneos, cambia el destino o pausa sin reimprimir.')}
    ${opt('static', 'Estático', 'El contenido va dentro del código. Funciona siempre, pero no se mide ni se edita.')}
  </fieldset>
  ${draft.mode === 'dynamic' ? langPicker('lang', draft.lang, 'Se aplica a la página de destino y a los avisos (código en pausa o sin destino). Puedes cambiarlo después sin reimprimir.') : ''}`;
}

function serviceOptions(selected, ids) {
  const list = ids ? SERVICES.filter((s) => ids.includes(s.id)) : SERVICES;
  return list.map((s) => `<option value="${s.id}" ${selected === s.id ? 'selected' : ''}>${esc(s.label)}</option>`).join('');
}

function fieldHTML(f, value, err, scope = 'data') {
  const id = `f-${scope}-${f.k}`;
  const helpId = f.help ? `${id}-help` : '';
  const errId = err ? `${id}-err` : '';
  const describedBy = [helpId, errId].filter(Boolean).join(' ');
  const common = `id="${id}" name="${f.k}" data-scope="${scope}" data-field="${f.k}" ${f.req ? 'required' : ''} ${err ? 'aria-invalid="true"' : ''} ${describedBy ? `aria-describedby="${describedBy}"` : ''}`;
  const span = f.half ? '' : 'span-2';
  const label = `<label for="${id}">${esc(f.label)}${f.req ? '<span class="req" aria-hidden="true">*</span>' : ''}</label>`;
  const help = f.help ? `<span class="help" id="${helpId}">${esc(f.help)}</span>` : '';
  const error = err ? `<span class="err" id="${errId}">${esc(err)}</span>` : '';
  let control = '';
  switch (f.type) {
    case 'textarea':
      control = `<textarea class="input" ${common} rows="3" ${f.max ? `maxlength="${f.max}"` : ''} placeholder="${esc(f.ph || '')}">${esc(value || '')}</textarea>`;
      break;
    case 'file': {
      const file = value;
      control = `<input class="input" type="file" ${common.replace('required', '')} accept="${f.accept || ''}" data-file-kind="single">
        ${file ? `<ul class="file-list"><li>${icon('pdf')}<span>${esc(file.name)}</span><span>${fileSize(file.size)}</span></li></ul>` : ''}`;
      break;
    }
    case 'files': {
      const files = value || [];
      control = `<input class="input" type="file" multiple ${common.replace('required', '')} data-file-kind="multi">
        ${files.length ? `<ul class="file-list">${files.map((x, i) => `<li>${icon('folder')}<span>${esc(x.name)}</span><span>${fileSize(x.size)}</span><button class="icon-btn" type="button" data-action="remove-file" data-idx="${i}" aria-label="Quitar ${esc(x.name)}">${icon('x')}</button></li>`).join('')}</ul>` : ''}`;
      break;
    }
    case 'linklist': {
      const links = value && value.length ? value : [{ icon: 'web', label: '', url: '' }];
      return `<fieldset class="field span-2 bare" ${describedBy ? `aria-describedby="${describedBy}"` : ''}>
        <legend class="label">${esc(f.label)}<span class="req" aria-hidden="true">*</span></legend>
        <div class="list-editor">${links.map((l, i) => {
          const svc = serviceById(l.icon || 'web');
          const customSrc = l.icon === 'custom' ? ImageStore.url(l.iconImg) : '';
          return `<div class="list-row cols-4">
          <div class="svc-pick"><span class="svc-dot" style="background:${svc.color}">${customSrc ? `<img src="${esc(customSrc)}" alt="">` : icon(svc.icon)}</span>
            <select class="input" aria-label="Ícono del enlace ${i + 1}" data-list="links" data-idx="${i}" data-key="icon">${serviceOptions(l.icon || 'web')}</select></div>
          <input class="input" aria-label="Texto del botón ${i + 1}" placeholder="${esc(svc.id === 'custom' ? 'Texto del botón' : svc.label)}" data-list="links" data-idx="${i}" data-key="label" value="${esc(l.label)}">
          <input class="input" type="url" aria-label="URL del enlace ${i + 1}" placeholder="https://" data-list="links" data-idx="${i}" data-key="url" value="${esc(l.url)}">
          <button class="icon-btn" type="button" data-action="remove-row" data-list="links" data-idx="${i}" aria-label="Quitar enlace ${i + 1}" ${links.length < 2 ? 'disabled' : ''}>${icon('trash')}</button>
          ${l.icon === 'custom' ? `<div class="row-extra"><label class="btn btn-ghost btn-sm">${icon('upload')}${customSrc ? 'Cambiar ícono' : 'Subir ícono propio'}<input type="file" accept="image/*" class="sr-only" data-img-upload="draft.data.links.${i}.iconImg" data-img-kind="icon"></label></div>` : ''}
          </div>`;
        }).join('')}
        </div>
        <button class="btn btn-ghost" type="button" data-action="add-row" data-list="links" style="align-self:flex-start">${icon('plus')}Agregar enlace</button>
        ${help}${error}</fieldset>`;
    }
    case 'sociallist': {
      const rows = value && value.length ? value : [{ network: 'instagram', label: '', url: '' }];
      return `<fieldset class="field span-2 bare" ${describedBy ? `aria-describedby="${describedBy}"` : ''}>
        <legend class="label">${esc(f.label)}<span class="req" aria-hidden="true">*</span></legend>
        <div class="list-editor">${rows.map((s, i) => {
          const svc = serviceById(s.network);
          return `<div class="list-row cols-4">
          <div class="svc-pick"><span class="svc-dot" style="background:${svc.color}">${icon(svc.icon)}</span>
            <select class="input" aria-label="Red ${i + 1}" data-list="socials" data-idx="${i}" data-key="network">${serviceOptions(s.network, SOCIAL_NETWORKS.map((n) => n.id))}</select></div>
          <input class="input" aria-label="Nombre del botón ${i + 1}" placeholder="${esc(svc.label)}" data-list="socials" data-idx="${i}" data-key="label" value="${esc(s.label || '')}">
          <input class="input" type="url" aria-label="Enlace de la red ${i + 1}" placeholder="https://" data-list="socials" data-idx="${i}" data-key="url" value="${esc(s.url)}">
          <button class="icon-btn" type="button" data-action="remove-row" data-list="socials" data-idx="${i}" aria-label="Quitar red ${i + 1}" ${rows.length < 2 ? 'disabled' : ''}>${icon('trash')}</button></div>`;
        }).join('')}
        </div>
        <button class="btn btn-ghost" type="button" data-action="add-row" data-list="socials" style="align-self:flex-start">${icon('plus')}Agregar red</button>
        <span class="help">El nombre del botón es opcional: si lo dejas vacío se usa el nombre de la red.</span>
        ${error}</fieldset>`;
    }
    default: {
      const type = f.type === 'number' ? 'number' : f.type;
      control = `<input class="input" type="${type}" ${common} value="${esc(value ?? '')}" placeholder="${esc(f.ph || '')}" ${f.type === 'number' ? 'step="any"' : ''} ${f.ac ? `autocomplete="${f.ac}"` : ''} ${f.list ? `list="${f.list}"` : ''}>`;
    }
  }
  return `<div class="field ${span}">${label}${control}${help}${error}</div>`;
}

/* Image slot with the recommended size, the uploaded size and orientation, and a warning when the shape does not fit. */
function imagePicker(path, ref, label, specKey, companyRef) {
  const spec = IMAGE_SPECS[specKey] || IMAGE_SPECS.photo;
  const src = ImageStore.url(ref);
  const dims = src ? ImageStore.dims(ref) : null;
  const orig = ref ? state.imageMeta?.[ref] : null;
  let info = `Recomendado: ${spec.rec} · ${spec.shape}. ${spec.tip}`;
  let warn = '';
  if (dims) {
    info = `Tu imagen: ${dims.w} × ${dims.h} px · ${orientationOf(dims)}${orig && (orig.ow > dims.w || orig.oh > dims.h) ? ` (original ${orig.ow} × ${orig.oh} px, reducida para guardarla)` : ''}. Recomendado: ${spec.rec} · ${spec.shape}.`;
    const ratio = dims.w / dims.h;
    if (Math.abs(Math.log(ratio / spec.ratio)) > 0.35) warn = `Su forma es ${orientationOf(dims)} y aquí se espera ${spec.shape}: se verá recortada.`;
  }
  return `<div class="field"><span class="label">${esc(label)}</span><div class="img-pick">
    <div class="img-thumb ${spec.thumb}">${src ? `<img src="${esc(src)}" alt="">` : icon('image')}</div>
    <div class="img-side">
      <div class="img-actions">
        <label class="btn btn-sm">${icon('upload')}${src ? 'Cambiar' : 'Subir'}<input type="file" accept="image/*" class="sr-only" data-img-upload="${path}" data-img-kind="${spec.process}"></label>
        ${companyRef && companyRef !== ref && ImageStore.has(companyRef) ? `<button type="button" class="btn btn-ghost btn-sm" data-action="img-set" data-path="${path}" data-ref="${esc(companyRef)}">De la empresa</button>` : ''}
        ${src ? `<button type="button" class="btn btn-ghost btn-sm" data-action="img-set" data-path="${path}" data-ref="">Quitar</button>` : ''}
      </div>
      <span class="help num">${esc(info)}</span>
      ${warn ? `<span class="warn-line">${icon('alert')}${esc(warn)}</span>` : ''}
    </div></div></div>`;
}

function paletteDatalist(id, colors) {

/* Editor for a 2-3 stop gradient stored at `path`. The palette datalist offers the company colors in the native picker. */
function gradientEditor(path, g, paletteId, opts = {}) {
  const gr = { type: 'linear', angle: 135, colors: ['#D2002E', '#92001F'], ...(g || {}) };
  const stops = gr.colors.map((c, i) => `<div class="grad-stop">
      <input type="color" value="${esc(c)}" data-grad="${path}" data-stop="${i}" ${paletteId ? `list="${paletteId}"` : ''} aria-label="Color ${i + 1} del degradado">
      <input class="input" value="${esc(c)}" data-grad-hex="${path}" data-stop="${i}" maxlength="7" aria-label="Color ${i + 1} en hexadecimal">
      ${gr.colors.length > 2 ? `<button type="button" class="icon-btn" data-action="grad-remove-stop" data-path="${path}" data-stop="${i}" aria-label="Quitar color ${i + 1}">${icon('x')}</button>` : ''}
    </div>`).join('');
  return `<div class="grad-editor">
    <div class="grad-preview" data-grad-preview="${path}" style="background:${esc(gradientCss(gr))}"></div>
    ${opts.named ? `<input class="input" placeholder="Nombre del degradado" data-grad-name="${path}" value="${esc(gr.name || '')}" aria-label="Nombre del degradado">` : ''}
    <div class="grad-stops">${stops}${gr.colors.length < 3 ? `<button type="button" class="btn btn-ghost btn-sm" data-action="grad-add-stop" data-path="${path}">${icon('plus')}Color</button>` : ''}</div>
    <div class="grad-controls">
      <div class="seg" role="radiogroup" aria-label="Tipo de degradado">
        <button type="button" role="radio" aria-checked="${gr.type !== 'radial'}" data-grad-type="${path}" data-value="linear">Lineal</button>
        <button type="button" role="radio" aria-checked="${gr.type === 'radial'}" data-grad-type="${path}" data-value="radial">Radial</button></div>
      ${gr.type !== 'radial' ? `<label class="grad-angle">Ángulo <input type="range" min="0" max="360" step="5" value="${Number(gr.angle) || 0}" data-grad-angle="${path}" aria-label="Ángulo del degradado"><span class="num" data-grad-angle-label="${path}">${Number(gr.angle) || 0}°</span></label>` : ''}
    </div></div>`;
}

function gradientChips(co, target) {
  const list = co?.gradients || [];
  if (!list.length) return '';
  return `<div class="presets">${list.map((g, i) => `<button type="button" class="preset" data-action="grad-apply" data-target="${target}" data-idx="${i}"><i style="background:${esc(gradientCss(g))}"></i>${esc(g.name || `Degradado ${i + 1}`)}</button>`).join('')}</div>`;
}

function galleryEditor(path, refs, co) {
  const pending = (co?.gallery || []).filter((g) => !refs.includes(g.img));
  return `<div class="gallery-edit">${refs.map((r, i) => `<div class="g-item"><img src="${esc(ImageStore.url(r))}" alt="Foto ${i + 1}">
      <button type="button" class="icon-btn" data-action="gallery-remove" data-path="${path}" data-idx="${i}" aria-label="Quitar foto ${i + 1}">${icon('x')}</button></div>`).join('')}
    <label class="g-add">${icon('plus')}<span>Agregar fotos</span><input type="file" accept="image/*" multiple class="sr-only" data-img-upload="${path}" data-img-kind="photo" data-img-multi="1"></label></div>
    ${pending.length ? `<button type="button" class="btn btn-ghost btn-sm" data-action="gallery-from-company" data-path="${path}" style="align-self:flex-start">${icon('image')}Agregar ${pending.length} fotos de ${esc(co.name)}</button>` : ''}`;
}

function pageControls() {
  const P = pageOf(draft);
  const co = draftCompany();
  const paletteId = 'page-palette';
  const colorField = (k, label) => `<div class="field"><label for="p-${k}">${label}</label><div class="color-row">

function luminance(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return 1;
  const n = parseInt(m[1], 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
function contrastRatio(a, b) { const la = luminance(a), lb = luminance(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }

function updatePreview() {
  const body = $('#preview-body');
  if (!body) return;
  const dynamic = draft.mode === 'dynamic';
  const testing = dynamic && previewTest;
  const test = testPayload(draft);
  const payload = testing ? (test || '') : qrPayload(draft);
  $('#payload-text').textContent = payload || '—';
  $('#payload-text').title = payload;
  $('#dest-info').innerHTML = dynamic ? `
    <p class="help"><b>El QR contiene</b> tu enlace corto. <b>Al escanearlo lleva a:</b> ${esc(destinationLabel(draft) || 'completa el contenido')}</p>
    <p class="help">${icon('info')} El enlace corto funciona apenas guardes el código. Puedes cambiar el destino después sin reimprimir el QR.</p>` : '';
  if (previewTab === 'landing') {
    body.innerHTML = landingHTML(draft);
  } else {
    let svg;
    const toggle = dynamic ? `<div style="display:flex;justify-content:center"><div class="seg" role="radiogroup" aria-label="Qué QR mostrar">
      <button type="button" role="radio" aria-checked="${!testing}" data-preview-test="0">QR final</button>
      <button type="button" role="radio" aria-checked="${testing}" data-preview-test="1">QR de prueba</button></div></div>` : '';
    try {
      if (testing && !test) throw new Error(PAGE_TYPES.includes(draft.type) && draft.type !== 'vcard' && draft.type !== 'maps'
        ? 'Este tipo abre una página de destino: guarda el código y escanea el QR final para probarla.'
        : 'Completa el contenido para generar el QR de prueba.');
      svg = layoutToSVG(qrLayout(payload, draft.design), 260);
    } catch (e) {
      svg = `<div class="empty" style="padding:24px">${icon('alert')}<p>${esc(e.message)} ${draft.mode === 'static' ? 'Acorta el contenido o usa un QR dinámico.' : ''}</p></div>`;
    }
    body.innerHTML = `${toggle}<div class="qr-stage"><div class="qr-box">${svg}</div></div>
      <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">${testing ? '<span class="badge sta">Prueba · apunta directo al destino, no lo imprimas</span>' : dynamic ? '<span class="badge dyn">Dinámico · medible</span>' : '<span class="badge sta">Estático · sin medición</span>'}</div>`;
  }
  const d = draft.design;
  const warns = [];
  if (contrastRatio(d.fg, d.bg) < 3 || contrastRatio(d.eye, d.bg) < 3) warns.push('Poco contraste entre el código y el fondo: algunos teléfonos no lo leerán.');
  if (luminance(d.fg) > luminance(d.bg)) warns.push('Módulos más claros que el fondo: varios lectores no reconocen códigos invertidos.');
  $('#contrast-warning').innerHTML = warns.map((w) => `<p class="warn-line">${icon('alert')}${esc(w)}</p>`).join('');
}
const updatePreviewSoon = debounce(updatePreview, 120);

/* What the dynamic code will redirect to, encoded directly, so the destination can be checked with a phone before the redirector exists. */
function testPayload(code) {
  if (['pdf', 'multiurl', 'files', 'social', 'app'].includes(code.type)) return null;
  const p = staticPayload(code.type, code.data || {});
  if (code.type === 'url' && !code.data?.url) return null;
  return p || null;
}

function landingHTML(code) {

function validateDraft() {
  const errs = {};
  const t = typeById(draft.type);
  const d = draft.data;
  if (!draft.title.trim()) errs.title = 'Ponle un nombre para encontrarlo en el panel.';
  for (const f of t.fields) {
    const v = d[f.k];
    if (f.type === 'linklist') {
      const rows = (v || []).filter((r) => r.label || r.url);
      if (!rows.some((r) => r.url)) { errs[f.k] = 'Agrega al menos un enlace con su URL.'; continue; }
      const bad = rows.findIndex((r) => !isHttpUrl(normalizeUrl(r.url)));
      if (bad >= 0) errs[f.k] = `El enlace ${bad + 1} no es una URL válida.`;
      continue;
    }
    if (f.type === 'sociallist') {
      const rows = (v || []).filter((r) => r.url);
      if (!rows.length) { errs[f.k] = 'Agrega al menos una red con su enlace.'; continue; }
      if (rows.some((r) => !isHttpUrl(normalizeUrl(r.url)))) errs[f.k] = 'Revisa los enlaces: alguno no es una URL válida.';
      continue;
    }
    if (f.type === 'file') { if (f.req && !v) errs[f.k] = 'Selecciona un archivo PDF.'; continue; }
    if (f.type === 'files') { if (f.req && !(v || []).length) errs[f.k] = 'Agrega al menos un archivo.'; continue; }
    const s = String(v ?? '').trim();
    if (!s) { if (f.req) errs[f.k] = 'Este campo es obligatorio.'; continue; }
    if (f.type === 'url' && !isHttpUrl(normalizeUrl(s))) errs[f.k] = 'Escribe una URL completa, por ejemplo https://www.ejemplo.com';
    if (f.type === 'email' && !isEmail(s)) errs[f.k] = 'Escribe un correo válido, por ejemplo nombre@empresa.com';
    if (f.type === 'tel' && phoneDigits(s).replace('+', '').length < 7) errs[f.k] = 'El número parece incompleto. Incluye el código de país.';
  }
  if (draft.type === 'app' && !d.iosUrl && !d.androidUrl && !errs.iosUrl) errs.iosUrl = 'Agrega al menos el enlace de App Store o el de Google Play.';
  if (draft.type === 'maps') {
    const hasCoords = d.lat !== undefined && d.lat !== '' && d.lng !== undefined && d.lng !== '';
    if (!String(d.address || '').trim() && !hasCoords) errs.address = 'Escribe una dirección o las dos coordenadas.';
    if (hasCoords && (Math.abs(Number(d.lat)) > 90 || Math.abs(Number(d.lng)) > 180)) errs.lat = 'La latitud va de -90 a 90 y la longitud de -180 a 180.';
  }
  if (!Object.keys(errs).length && draft.mode === 'static') {
    try { qrLayout(staticPayload(draft.type, d), draft.design); } catch { errs._payload = 'El contenido es demasiado largo para un QR estático. Acórtalo o usa un QR dinámico.'; }
  }
  return errs;
}

function normalizeDraftData() {
  const t = typeById(draft.type);
  for (const f of t.fields) {
    if (f.type === 'url' && draft.data[f.k]) draft.data[f.k] = normalizeUrl(draft.data[f.k]);
    if (f.type === 'linklist') draft.data[f.k] = (draft.data[f.k] || []).filter((r) => r.label || r.url).map((r) => ({ icon: r.icon || 'web', iconImg: r.iconImg || null, label: (r.label || '').trim(), url: normalizeUrl(r.url) }));
    if (f.type === 'sociallist') draft.data[f.k] = (draft.data[f.k] || []).filter((r) => r.url).map((r) => ({ network: r.network, label: (r.label || '').trim(), url: normalizeUrl(r.url) }));
  }
  draft.title = draft.title.trim();
  const co = draftCompany();
  draft.client = co ? co.name : '';
}

let guardando = false;
async function saveDraft() {
  if (guardando) return;
  draftErrors = validateDraft();
  if (Object.keys(draftErrors).length) {
    renderCreate();
    const first = $('[aria-invalid="true"]') || $('.err');
    first?.focus?.();
    first?.scrollIntoView({ block: 'center' });
    toast('Revisa los campos marcados.', 'error');
    return;
  }
  normalizeDraftData();
  const now = new Date().toISOString();
  const i = editingId ? state.codes.findIndex((c) => c.id === editingId) : -1;
  const record = i >= 0 ? { ...draft, updatedAt: now } : { ...draft, demo: false, createdAt: now, updatedAt: now };
  guardando = true;
  const ok = await conWix(() => guardarCodigoRemoto(record), 'No se pudo guardar en Wix.');
  guardando = false;
  if (!ok) return;
  if (i >= 0) state.codes[i] = record; else state.codes.unshift(record);
  saveState();
  const wasEditing = Boolean(editingId);
  draft = null; editingId = null;
  toast(wasEditing ? 'Cambios guardados.' : 'Código creado.');
  go('codes');
}

function bestWeekday(a) {
  const totals = a.heat.map((row) => row.reduce((x, y) => x + y, 0));
  const max = Math.max(...totals);
  if (!max) return '—';
  return ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'][totals.indexOf(max)];
}

function heatmapHTML(a) {
  const max = Math.max(1, ...a.heat.flat());
  const order = [0, 1, 2, 3, 4, 5, 6];
  let cells = '';
  for (let h = 0; h < 24; h++) {
    cells += `<span class="hm-h">${String(h).padStart(2, '0')}:00</span>`;
    for (const d of order) {
      const v = a.heat[d][h];
      cells += `<span class="hm-cell" style="--v:${(v / max).toFixed(3)}" title="${WEEKDAYS_SHORT[d]} ${String(h).padStart(2, '0')}:00 · ${fmtN(v)} escaneos"></span>`;
    }
  }
  cells += '<span></span>' + order.map((d) => `<span class="hm-d">${WEEKDAYS_SHORT[d]}</span>`).join('');
  return `<div class="heatmap" role="img" aria-label="Mapa de calor de escaneos por hora y día de la semana">${cells}</div>
    <div class="hm-legend"><span>Menos</span><span class="bar"></span><span>Más</span></div>`;
}

function pagedTable(key, rows, total, headers, cells) {
  const st = tables[key];
  const pages = Math.max(1, Math.ceil(rows.length / st.size));
  st.page = Math.min(st.page, pages - 1);
  const slice = rows.slice(st.page * st.size, st.page * st.size + st.size);
  const maxV = rows[0]?.v || 1;
  if (!rows.length) return '<p class="muted">Sin escaneos en este periodo.</p>';
  return `<div class="table-wrap"><table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join('')}<th class="num">Escaneos</th><th>% de escaneos</th></tr></thead>
    <tbody>${slice.map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join('')}<td class="num">${fmtN(r.v)}</td><td class="num"><span class="share-bar" style="width:${Math.max(3, (r.v / maxV) * 70)}px"></span>${fmtPct(r.v / (total || 1))}</td></tr>`).join('')}</tbody></table></div>
    <div class="pager"><label>Filas <select class="input" data-page-size="${key}">${[5, 10, 25].map((n) => `<option ${st.size === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <span class="num">${st.page * st.size + 1}–${Math.min(rows.length, (st.page + 1) * st.size)} de ${rows.length}</span>
      <button class="icon-btn" data-page="${key}" data-dir="-1" aria-label="Página anterior" ${st.page === 0 ? 'disabled' : ''}>${icon('chevL')}</button>
      <button class="icon-btn" data-page="${key}" data-dir="1" aria-label="Página siguiente" ${st.page >= pages - 1 ? 'disabled' : ''}>${icon('chevR')}</button></div>`;
}

function drawTrend() {
  const wrap = $('#trend-chart');
  if (!wrap || !lastSeries) return;
  const width = Math.max(280, wrap.clientWidth);
  wrap.innerHTML = trendSVG(lastSeries, { width, height: 260, mode: anFilter.mode, interactive: true, label: 'Escaneos del periodo actual frente al anterior',
    pal: { cur: 'var(--chart-cur)', prev: 'var(--chart-prev)', grid: 'var(--line)', axis: 'var(--line)', text: 'var(--muted)', bg: 'var(--bg)' } }) + '<div class="tooltip" hidden></div>';
}

function onChartHover(e) {
  const wrap = e.target.closest('#trend-chart');
  if (!wrap || !lastSeries) return;
  const tip = $('.tooltip', wrap);
  const i = e.target.getAttribute?.('data-i');
  if (i === null || i === undefined) { tip.hidden = true; return; }
  const k = Number(i);
  tip.hidden = false;
  tip.innerHTML = `<b>${esc(lastSeries.full[k])}</b><br><i style="background:var(--chart-cur)"></i>Actual: ${fmtN(lastSeries.cur[k])}<br><i style="background:var(--chart-prev)"></i>Anterior: ${fmtN(lastSeries.prev[k])}`;
  const rect = wrap.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  tip.style.left = `${Math.min(Math.max(0, x + 12), rect.width - tip.offsetWidth)}px`;
  tip.style.top = `${Math.max(0, y - tip.offsetHeight - 10)}px`;
}

function analyticsCSV(a, label) {
  const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const lines = [];
  lines.push(q('TRK QR Code Generator'), q(`Selección: ${label}`), q(`Periodo: ${dayKey(a.start)} a ${dayKey(a.end)}`), '');
  lines.push(['Fecha', 'Escaneos', 'Usuarios únicos', 'Fecha periodo anterior', 'Escaneos periodo anterior'].map(q).join(','));
  for (let i = 0; i < a.days; i++) lines.push([dayKey(a.labels[i]), a.cur[i], Math.round(a.curU[i]), dayKey(addDays(a.pstart, i)), a.prev[i]].join(','));
  lines.push('', ['País', 'Escaneos', '% de escaneos'].map(q).join(','));
  for (const r of a.countryList) lines.push([q(r.name), Math.round(r.v), (r.v / (a.total || 1) * 100).toFixed(2)].join(','));
  lines.push('', ['Ciudad', 'Provincia / estado', 'País', 'Escaneos'].map(q).join(','));
  for (const r of a.cityList) lines.push([q(r.city), q(r.region), q(r.country), Math.round(r.v)].join(','));
  lines.push('', ['Dispositivo', 'Escaneos'].map(q).join(','));
  for (const r of a.deviceList) lines.push([q(r.name), Math.round(r.v)].join(','));
  lines.push('', ['Hora', ...WEEKDAYS_SHORT].map(q).join(','));
  for (let h = 0; h < 24; h++) lines.push([q(`${String(h).padStart(2, '0')}:00`), ...a.heat.map((row) => Math.round(row[h]))].join(','));
  lines.push('', ['Código', 'Cliente', 'Enlace corto', 'Escaneos', 'Periodo anterior'].map(q).join(','));
  for (const p of a.perCode) lines.push([q(p.code.title), q(p.code.client || ''), q(shortUrl(p.code)), p.cur, p.prev].join(','));
  return '﻿' + lines.join('\r\n');
}

function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (shift) => Math.round(((pa >> shift) & 255) + ((((pb >> shift) & 255) - ((pa >> shift) & 255)) * t));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

  const foot = (p) => `<div class="rpt-foot"><span>TRK QR Code Generator v${APP_VERSION} · theroofingknight.com</span><span>Página ${p} de ${pages}</span></div>`;

async function exportReportPDF(btn) {
  const pages = $$('#rpt-pages .rpt-page');
  if (!pages.length) return;
  if (!window.html2canvas || !window.jspdf) { toast('No cargaron las herramientas de PDF. Revisa tu conexión y recarga.', 'error'); return; }
  const label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = `${icon('download')}Preparando PDF…`;
  try {
    const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
    for (let i = 0; i < pages.length; i++) {
      const canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#F6F5F1', logging: false });
      if (i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 595.28, 841.89);
    }
    const name = `${slugify(rptFilter.name || 'informe-qr')}-${slugify(targetLabel(rptFilter.target))}-${dayKey(today())}.pdf`;
    await saveFile(name, pdf.output('blob'));
  } catch (e) {
    toast('No se pudo crear el PDF. Intenta de nuevo.', 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = label;
  }
}

/* Reads coordinates from a pasted Google Maps URL or a "lat, lng" pair. Short maps.app.goo.gl links carry no coordinates. */
function parseMapsInput(text) {
  const s = String(text || '').trim();
  const patterns = [/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/, /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/, /[?&](?:q|query|ll|destination)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i, /^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/];
  for (const re of patterns) {
    const m = re.exec(s);
    if (m) {
      const lat = Number(m[1]), lng = Number(m[2]);
      if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat: String(lat), lng: String(lng) };
    }
  }
  return null;
}

/* A throwaway code built from the company record so each QR type can be previewed with real data. */
function companySampleCode(co, type) {
  const t = typeById(type);
  const data = { ...emptyData(type), ...companyData(co, type) };
  const person = (co.people || []).find((p) => p.firstName || p.lastName);
  switch (type) {
    case 'vcard':
      if (person) Object.assign(data, pickDefined({ firstName: person.firstName, lastName: person.lastName, jobTitle: person.jobTitle, email: person.email, mobile: person.phone || person.whatsapp }));
      else if (!data.firstName) data.firstName = co.name;
      break;
    case 'pdf': data.file = { name: 'catalogo.pdf', size: 1800000 }; data.pdfDesc = 'Documento de ejemplo'; break;
    case 'files': data.files = [{ name: 'catalogo.pdf', size: 1800000 }, { name: 'fotos.zip', size: 5200000 }]; break;
    case 'sms': case 'whatsapp': data.message = 'Hola, quiero más información.'; break;
    case 'email': data.subject = 'Consulta'; data.body = 'Hola, quiero más información.'; break;
    case 'app': if (!data.appDesc) data.appDesc = `Descarga la app de ${co.name || 'la empresa'}.`; break;
    default: break;
  }
  const page = brandPage(co, type);
  if (type === 'vcard' && person?.photo) page.avatar = person.photo;
  return { id: 'preview', slug: 'vista', type, mode: t.modes.includes('dynamic') ? 'dynamic' : 'static', status: 'active', companyId: co.id,
    data, page, design: { ...DEFAULT_DESIGN, eye: co.colors?.primary || '#D2002E' } };
}

function validateCompany() {
  const co = coDraft;
  const e = {};
  if (!co.name.trim()) e.name = 'Escribe el nombre comercial.';
  if (co.ruc && !/^\d{13}$/.test(co.ruc.trim())) e.ruc = 'El RUC tiene 13 dígitos, sin guiones ni espacios.';
  if (co.website && !isHttpUrl(normalizeUrl(co.website))) e.website = 'Escribe una URL completa, por ejemplo https://www.empresa.com';
  if (co.email && !isEmail(co.email)) e.email = 'Escribe un correo válido.';
  for (const k of ['phone', 'mobile', 'whatsapp']) if (co[k] && phoneDigits(co[k]).replace('+', '').length < 7) e[k] = 'El número parece incompleto.';
  for (const k of ['ios', 'android']) if (co.apps?.[k] && !isHttpUrl(normalizeUrl(co.apps[k]))) e[`apps.${k}`] = 'Escribe la URL completa de la tienda.';
  if (co.lat !== '' && co.lat != null && Math.abs(Number(co.lat)) > 90) e.lat = 'La latitud va de -90 a 90.';
  if (co.lng !== '' && co.lng != null && Math.abs(Number(co.lng)) > 180) e.lng = 'La longitud va de -180 a 180.';
  if ((co.socials || []).some((s) => s.url && !isHttpUrl(normalizeUrl(s.url)))) e.socials = 'Revisa los enlaces de redes: alguno no es una URL válida.';
  const badPerson = (co.people || []).find((p) => p.email && !isEmail(p.email));
  if (badPerson) e.people = `Revisa el correo de ${[badPerson.firstName, badPerson.lastName].filter(Boolean).join(' ') || 'una persona'}.`;
  const days = co.hours?.mode === 'weekly' ? Object.entries(co.hours.days || {}) : [];
  const badDay = days.find(([, d]) => d.status === 'open' && (d.ranges || []).some((r) => !r.from || !r.to || r.from >= r.to));
  if (badDay) e.hoursNote = `Revisa el horario del ${WEEK.find(([k]) => k === badDay[0])[1].toLowerCase()}: cada turno debe terminar después de empezar.`;
  return e;
}

async function saveCompany(next = {}) {
  if (guardando) return;
  coErrors = validateCompany();
  if (Object.keys(coErrors).length) {
    renderCompanyEditor();
    const first = $('[aria-invalid="true"]') || $('#view .err');
    first?.focus?.();
    first?.scrollIntoView({ block: 'center' });
    toast('Revisa los campos marcados.', 'error');
    return;
  }
  const co = coDraft;
  co.name = co.name.trim();
  if (co.website) co.website = normalizeUrl(co.website);
  co.apps = { ios: co.apps?.ios ? normalizeUrl(co.apps.ios) : '', android: co.apps?.android ? normalizeUrl(co.apps.android) : '' };
  co.socials = (co.socials || []).filter((s) => s.url).map((s) => ({ network: s.network, label: (s.label || '').trim(), url: normalizeUrl(s.url) }));
  co.people = (co.people || []).filter((p) => p.firstName || p.lastName || p.email || p.phone || p.photo);
  co.extraColors = (co.extraColors || []).filter((x) => /^#[0-9A-F]{6}$/i.test(x.hex));
  const now = new Date().toISOString();
  const i = state.companies.findIndex((c) => c.id === co.id);
  const record = i >= 0 ? { ...co, updatedAt: now } : { ...co, createdAt: now, updatedAt: now };
  guardando = true;
  const ok = await conWix(() => guardarEmpresaRemota(record), 'No se pudo guardar la empresa en Wix.');
  guardando = false;
  if (!ok) return;
  if (i >= 0) state.companies[i] = record; else state.companies.push(record);
  for (const code of state.codes) {
    if (code.companyId === co.id && code.client !== co.name) { code.client = co.name; guardarCodigoRemoto(code).catch(() => {}); }
  }
  saveState();
  const back = coReturn;
  const savedId = co.id;
  coDraft = null; coErrors = {}; coReturn = null;
  toast(i >= 0 ? 'Empresa guardada.' : 'Empresa creada.');
  if (next.type) { go('create', { companyId: savedId, type: next.type }); return; }
  if (back === 'create' && draft) {
    applyCompany(findCompany(savedId), { brand: true });
    go('create', { keepDraft: true });
  } else {
    renderCompanies();
  }
}

/* ───────────────────────── View: business cards ───────────────────────── */

/* TRK Business Cards: 9:16 art + QR. The QR either opens the Wix card page
   (tracked, needs internet) or carries the vCard itself (works offline). Format kept compatible
   with the "Business Card\Tarjetas" folders: arte.png, qr.png, contacto.vcf, datos.json. */
const CARD_PAGE_BASE = 'https://www.theroofingknight.com/_functions/tarjetaPage?id=';
const CARD_W = 1080, CARD_H = 1920;
const CARD_FONT = '"Segoe UI", -apple-system, Roboto, sans-serif';

let cardDraft = null;
let cardErrors = {};
let cardTab = 'arte';
let cardPageTheme = 'claro';
const openCardGroups = new Set();

function emptyCard() {
  return { id: uid('card'), nombre: '', cargo: '', empresa: '', companyId: null, personId: null, telefono: '', correo: '', direccion: '', web: '',
    acento: '#D2002E', foto: null, logo: null, fondo: null, fondoTipo: 'acento', gradiente: null, velo: 38, modo: 'wix', idioma: 'en', publicada: false, fecha: '', carpeta: '' };
}
function cardSlug(c) {
  if (c.slugPublico) return c.slugPublico;
  return `${c.empresa}-${c.nombre}`.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'tarjeta';
}
function cardFolder(c) { return `${c.empresa || 'Empresa'} - ${c.nombre || 'Nombre'}`.replace(/[\\/:*?"<>|]+/g, ' ').trim(); }
function cardUrl(c) { return CARD_PAGE_BASE + cardSlug(c); }

function cardVCard(c, photoDataUrl) {
  const parts = (c.nombre || ' ').trim().split(/\s+/);
  const last = parts.length > 1 ? parts.slice(-1)[0] : '';
  const first = parts.length > 1 ? parts.slice(0, -1).join(' ') : parts[0];
  const fold = (l) => { const out = []; while (l.length > 75) { out.push(l.slice(0, 75)); l = ` ${l.slice(75)}`; } out.push(l); return out.join('\r\n'); };
  const lines = ['BEGIN:VCARD', 'VERSION:3.0', `N:${vEsc(last)};${vEsc(first)};;;`, `FN:${vEsc(c.nombre)}`, `ORG:${vEsc(c.empresa)}`];
  if (c.cargo) lines.push(`TITLE:${vEsc(c.cargo)}`);
  if (c.telefono) lines.push(`TEL;TYPE=CELL:${phoneDigits(c.telefono)}`);
  if (c.correo) lines.push(`EMAIL;TYPE=INTERNET:${c.correo.trim()}`);
  if (c.direccion) lines.push(`ADR;TYPE=WORK:;;${vEsc(c.direccion)};;;;`);
  if (c.web) lines.push(`URL:${normalizeUrl(c.web)}`);
  if (c.modo === 'wix') lines.push(`URL;TYPE=Tarjeta:${cardUrl(c)}`);
  if (photoDataUrl && photoDataUrl.startsWith('data:image/jpeg')) lines.push(fold(`PHOTO;ENCODING=b;TYPE=JPEG:${photoDataUrl.split(',')[1]}`));
  lines.push('END:VCARD');
  return lines.join('\r\n');
}
function cardQrContent(c) { return c.modo === 'wix' ? cardUrl(c) : cardVCard(c); }

/* ── Art 9:16 (same composition as the original generador.html) ── */
function mixRgb(hex, factor, toward) {
  const n = parseInt(String(hex || '#D2002E').slice(1), 16);
  const m = (v) => Math.round(v + (toward - v) * factor);
  return `rgb(${m((n >> 16) & 255)},${m((n >> 8) & 255)},${m(n & 255)})`;
}
function drawCover(ctx, img, x, y, w, h) {
  const ir = img.width / img.height, r = w / h;
  let sw, sh, sx, sy;
  if (ir > r) { sh = img.height; sw = sh * r; sx = (img.width - sw) / 2; sy = 0; } else { sw = img.width; sh = sw / r; sx = 0; sy = (img.height - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function wrapText(ctx, text, maxW) {
  const words = String(text).split(/\s+/), lines = [];
  let cur = '';
  for (const w of words) { const t = cur ? `${cur} ${w}` : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);

}
async function cardImage(ref) { const u = ImageStore.url(ref); if (!u) return null; try { return await loadImage(u); } catch { return null; } }

function paintGradient(ctx, g, W, H) {
  const colors = (g?.colors || []).filter(Boolean);
  let grad;
  if (g?.type === 'radial') grad = ctx.createRadialGradient(W * 0.3, H * 0.2, 0, W * 0.3, H * 0.2, Math.hypot(W, H));
  else {
    const a = ((Number(g?.angle) || 0) - 90) * Math.PI / 180;
    const len = Math.abs(W * Math.cos(a)) + Math.abs(H * Math.sin(a));
    const cx = W / 2, cy = H / 2;
    grad = ctx.createLinearGradient(cx - Math.cos(a) * len / 2, cy - Math.sin(a) * len / 2, cx + Math.cos(a) * len / 2, cy + Math.sin(a) * len / 2);
  }
  colors.forEach((c, i) => grad.addColorStop(colors.length === 1 ? 0 : i / (colors.length - 1), c));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

async function drawCardArt(c, canvas) {
  const ctx = canvas.getContext('2d');
  const W = CARD_W, H = CARD_H;
  ctx.clearRect(0, 0, W, H);
  const fondo = c.fondoTipo === 'imagen' ? await cardImage(c.fondo) : null;
  if (fondo) {
    drawCover(ctx, fondo, 0, 0, W, H);
    ctx.fillStyle = `rgba(10,16,22,${(Number(c.velo) || 0) / 100})`;
    ctx.fillRect(0, 0, W, H);
  } else if (c.fondoTipo === 'gradiente' && c.gradiente) {
    paintGradient(ctx, c.gradiente, W, H);
    ctx.fillStyle = `rgba(10,16,22,${Math.min(0.5, (Number(c.velo) || 0) / 200)})`;
    ctx.fillRect(0, 0, W, H);
  } else {
    const g = ctx.createLinearGradient(0, 0, W * 0.4, H);
    g.addColorStop(0, mixRgb(c.acento, 0.25, 255)); g.addColorStop(0.45, c.acento); g.addColorStop(1, mixRgb(c.acento, 0.45, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  const logo = await cardImage(c.logo);
  if (logo) {
    roundRectPath(ctx, 72, 84, 108, 108, 24); ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fill();
    ctx.save(); roundRectPath(ctx, 84, 96, 84, 84, 16); ctx.clip();
    const s = Math.min(84 / logo.width, 84 / logo.height);
    ctx.drawImage(logo, 84 + (84 - logo.width * s) / 2, 96 + (84 - logo.height * s) / 2, logo.width * s, logo.height * s);
    ctx.restore();
  }
  ctx.fillStyle = '#FFFFFF'; ctx.font = `600 46px ${CARD_FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  let empresa = c.empresa || 'Tu empresa', fe = 46;
  while (fe > 28 && ctx.measureText(empresa).width > W - 72 - (logo ? 220 : 72)) { fe -= 2; ctx.font = `600 ${fe}px ${CARD_FONT}`; }
  ctx.fillText(empresa, W - 72, 140);

  const foto = await cardImage(c.foto);
  const cx = W / 2, cy = 490, radio = 180;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, radio, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, radio - 10, 0, Math.PI * 2); ctx.clip();
  if (foto) drawCover(ctx, foto, cx - radio + 10, cy - radio + 10, (radio - 10) * 2, (radio - 10) * 2);
  else {
    ctx.fillStyle = 'rgba(255,255,255,.30)'; ctx.fillRect(cx - radio, cy - radio, radio * 2, radio * 2);
    ctx.fillStyle = '#FFFFFF'; ctx.font = `650 120px ${CARD_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(companyInitials(c.nombre || '?'), cx, cy + 8);
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#FFFFFF'; ctx.font = `700 84px ${CARD_FONT}`;
  let y = 795;
  for (const l of wrapText(ctx, c.nombre || 'Nombre Apellido', W - 160).slice(0, 2)) { ctx.fillText(l, cx, y); y += 92; }
  if (c.cargo) { ctx.font = `400 44px ${CARD_FONT}`; ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fillText(c.cargo, cx, y); }

  const side = 430, px = (W - side) / 2, py = H - side - 120;
  const left = 84, right = W - 84;
  ctx.font = `500 38px ${CARD_FONT}`;
  const dir = c.direccion ? wrapText(ctx, c.direccion, W - 168).slice(0, 2) : [];
  let cursor = py - 46;
  if (dir.length) {
    ctx.textAlign = 'left'; ctx.fillStyle = '#FFFFFF';
    for (let i = dir.length - 1; i >= 0; i--) { ctx.fillText(dir[i], left, cursor); cursor -= 50; }
    ctx.font = `600 28px ${CARD_FONT}`; ctx.fillStyle = 'rgba(255,255,255,.72)'; ctx.fillText('DIRECCIÓN', left, cursor);
    cursor -= 62;
  }
  ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'left'; ctx.font = `500 42px ${CARD_FONT}`;
  ctx.fillText(c.telefono || '+593 …', left, cursor);
  let fc = 42; const mail = c.correo || 'correo@empresa.com';
  while (fc > 26 && ctx.measureText(mail).width > 500) { fc -= 2; ctx.font = `500 ${fc}px ${CARD_FONT}`; }
  ctx.textAlign = 'right'; ctx.fillText(mail, right, cursor);
  cursor -= 52;
  ctx.font = `600 28px ${CARD_FONT}`; ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.textAlign = 'left'; ctx.fillText('TELÉFONO', left, cursor);
  ctx.textAlign = 'right'; ctx.fillText('CORREO', right, cursor);

  roundRectPath(ctx, px, py, side, side, 32); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  try {
    const content = cardQrContent(c);
    const L = qrLayout(content, { ...DEFAULT_DESIGN, fg: '#14202B', eye: '#14202B', margin: 0, ecl: content.length > 180 ? 'L' : 'M' });
    const pad = 28, scale = (side - pad * 2) / L.total;
    ctx.fillStyle = '#14202B';
    for (const o of L.ops) {
      if (o.t !== 'rect') continue;
      ctx.fillStyle = o.fill;
      ctx.fillRect(px + pad + o.x * scale, py + pad + o.y * scale, Math.ceil(o.w * scale), Math.ceil(o.h * scale));
    }
  } catch {
    ctx.fillStyle = '#C0392B'; ctx.font = `400 26px ${CARD_FONT}`; ctx.textAlign = 'center';
    ctx.fillText('Contenido muy largo: acorta dirección o web', cx, py + side / 2);
  }
  ctx.textAlign = 'center'; ctx.font = `500 34px ${CARD_FONT}`; ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillText(c.modo === 'wix' ? 'Escanea para guardar el contacto' : 'Escanea para guardar el contacto (sin internet)', cx, H - 46);
}

const cardThumbCache = new Map();
function cardKey(c) { return JSON.stringify([c.nombre, c.cargo, c.empresa, c.telefono, c.correo, c.direccion, c.web, c.acento, c.foto, c.logo, c.fondo, c.fondoTipo, c.gradiente, c.velo, c.modo]); }
async function cardThumbUrl(c) {
  const key = cardKey(c);
  if (cardThumbCache.has(key)) return cardThumbCache.get(key);
  const canvas = document.createElement('canvas');
  canvas.width = CARD_W; canvas.height = CARD_H;
  await drawCardArt(c, canvas);
  const small = document.createElement('canvas');
  small.width = 270; small.height = 480;
  small.getContext('2d').drawImage(canvas, 0, 0, 270, 480);
  const url = await new Promise((resolve) => small.toBlob((b) => resolve(b ? URL.createObjectURL(b) : ''), 'image/jpeg', 0.85));
  cardThumbCache.set(key, url);
  return url;
}
function fillCardThumbs() {
  for (const img of $$('[data-card-thumb]')) {
    const c = (state.cards || []).find((x) => x.id === img.dataset.cardThumb);
    if (c) cardThumbUrl(c).then((u) => { if (u) img.src = u; });
  }
}

function applyCompanyToCard(co) {
  const c = cardDraft;
  c.companyId = co?.id || null;
  if (!co) return;
  const colors = { ...DEFAULT_COLORS, ...(co.colors || {}) };
  Object.assign(c, { empresa: co.name, acento: colors.primary, web: co.website || c.web, direccion: fullAddress(co) || c.direccion });
  if (co.logo) c.logo = co.logo;
  if (!c.telefono && (co.mobile || co.phone)) c.telefono = co.mobile || co.phone;
  if (!c.correo && co.email) c.correo = co.email;
  if (co.gradients?.length && c.fondoTipo === 'acento') { c.fondoTipo = 'gradiente'; c.gradiente = clone(co.gradients[0]); }
}
function applyPersonToCard(personId) {
  const co = cardDraft.companyId ? findCompany(cardDraft.companyId) : null;
  const p = (co?.people || []).find((x) => x.id === personId);
  cardDraft.personId = personId || null;
  if (!p) return;
  Object.assign(cardDraft, pickDefined({ nombre: [p.firstName, p.lastName].filter(Boolean).join(' '), cargo: p.jobTitle, telefono: p.phone || p.whatsapp, correo: p.email, foto: p.photo }));
}

function validateCard() {
  const c = cardDraft, e = {};
  if (!c.nombre.trim()) e.nombre = 'Escribe el nombre.';
  if (!c.empresa.trim()) e.empresa = 'Escribe la empresa.';
  if (!c.telefono.trim()) e.telefono = 'Escribe el teléfono.'; else if (phoneDigits(c.telefono).replace('+', '').length < 7) e.telefono = 'El número parece incompleto.';
  if (!c.correo.trim()) e.correo = 'Escribe el correo.'; else if (!isEmail(c.correo)) e.correo = 'Escribe un correo válido.';
  if (c.web && !isHttpUrl(normalizeUrl(c.web))) e.web = 'Escribe una URL completa.';
  const dup = (state.cards || []).find((x) => x.id !== c.id && cardSlug(x) === cardSlug(c));
  if (dup) e.nombre = 'Ya existe una tarjeta con esta empresa y nombre: ambas tendrían el mismo enlace.';
  return e;
}

async function saveCard() {
  if (guardando) return;
  cardErrors = validateCard();
  if (Object.keys(cardErrors).length) {
    renderCardEditor();
    $('[aria-invalid="true"]')?.focus();
    toast('Revisa los campos marcados.', 'error');
    return;
  }
  const c = cardDraft;
  if (c.web) c.web = normalizeUrl(c.web);
  const now = new Date().toISOString();
  state.cards = state.cards || [];
  const i = state.cards.findIndex((x) => x.id === c.id);
  const record = i >= 0 ? { ...c, updatedAt: now } : { ...c, createdAt: now, updatedAt: now, fecha: now };
  guardando = true;
  toast('Publicando la tarjeta en Wix…');
  const ok = await conWix(() => guardarTarjetaRemota(record), 'No se pudo guardar la tarjeta en Wix.');
  guardando = false;
  if (!ok) return;
  if (i >= 0) state.cards[i] = record; else state.cards.push(record);
  saveState();
  openCardGroups.add(c.empresa);
  cardDraft = null; cardErrors = {};
  toast(i >= 0 ? 'Tarjeta guardada.' : 'Tarjeta creada.');
  renderCards();
}

async function cardDatosJson(c) {

const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(entries) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const { name, data } of entries) {
    const bytes = data instanceof Blob ? new Uint8Array(await data.arrayBuffer()) : typeof data === 'string' ? enc.encode(data) : data;
    const nameBytes = enc.encode(name);
    const crc = crc32(bytes);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true); local.setUint16(8, 0, true);
    local.setUint16(10, dosTime, true); local.setUint16(12, dosDate, true); local.setUint32(14, crc, true);
    local.setUint32(18, bytes.length, true); local.setUint32(22, bytes.length, true); local.setUint16(26, nameBytes.length, true); local.setUint16(28, 0, true);
    chunks.push(new Uint8Array(local.buffer), nameBytes, bytes);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true); cd.setUint16(14, dosDate, true); cd.setUint32(16, crc, true); cd.setUint32(20, bytes.length, true); cd.setUint32(24, bytes.length, true);
    cd.setUint16(28, nameBytes.length, true); cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nameBytes);
    offset += 30 + nameBytes.length + bytes.length;
  }
  const cdSize = central.reduce((s, a) => s + a.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
async function cardEntries(c, prefix = '') {
  const photo = c.foto ? await ImageStore.dataUrl(c.foto) : '';
  const files = [
    { name: `${prefix}arte.png`, data: await cardArtBlob(c) },
    { name: `${prefix}qr.png`, data: await cardQrBlob(c) },
    { name: `${prefix}contacto.vcf`, data: cardVCard(c, photo) },
    { name: `${prefix}datos.json`, data: await cardDatosJson(c) }
  ];
  const blobOf = (ref) => (ref ? ImageStore.dataUrl(ref).then((u) => (u ? dataUrlToBlob(u) : null)) : null);
  const extras = [['foto.jpg', c.foto], ['logo.png', c.logo], ['fondo.jpg', c.fondoTipo === 'imagen' ? c.fondo : null]];
  for (const [n, ref] of extras) { const b = await blobOf(ref); if (b) files.push({ name: `${prefix}${n}`, data: b }); }
  return files;
}
function cardRegistryEntry(c) {
  const folder = cardFolder(c);
  return { id: folder, nombre: c.nombre, cargo: c.cargo, empresa: c.empresa, telefono: c.telefono, correo: c.correo, direccion: c.direccion, web: c.web, acento: c.acento,
    modo: c.modo === 'wix' ? 'wix' : 'directo', url: c.modo === 'wix' ? cardUrl(c) : '', fecha: (c.fecha || c.createdAt || '').slice(0, 19), carpeta: folder,
    archivos: { artePng: `${folder}/arte.png`, qrPng: `${folder}/qr.png`, foto: c.foto ? `${folder}/foto.jpg` : '', logo: c.logo ? `${folder}/logo.png` : '', fondo: c.fondoTipo === 'imagen' && c.fondo ? `${folder}/fondo.jpg` : '', vcf: `${folder}/contacto.vcf` } };
}

/* ── Import from the Business Card\Tarjetas folder ── */
async function importCardFolder(fileList) {
  const files = Array.from(fileList || []);
  const datos = files.filter((f) => /(^|[\\/])datos\.json$/i.test(f.webkitRelativePath || f.name));
  if (!datos.length) { toast('No encontré archivos datos.json. Elige la carpeta Business Card\\Tarjetas.', 'error'); return; }
  const regFile = files.find((f) => /registro\.json$/i.test(f.webkitRelativePath || f.name));
  let registry = [];
  try { registry = regFile ? JSON.parse(await regFile.text()) : []; } catch { registry = []; }
  if (guardando) return;
  guardando = true;
  state.cards = state.cards || [];
  let added = 0, skipped = 0, companiesCreated = 0, errores = 0;
  const tocadas = new Set();
  for (const f of datos) {
    try {
      toast(`Importando ${added + skipped + errores + 1} de ${datos.length}…`);
      const d = JSON.parse(await f.text());
      const folder = (f.webkitRelativePath || '').split(/[\\/]/).slice(-2, -1)[0] || '';
      const card = { ...emptyCard(), nombre: d.nombre || '', cargo: d.cargo || '', empresa: d.empresa || '', telefono: d.telefono || '', correo: d.correo || '',
        direccion: d.direccion || '', web: d.web || '', acento: /^#[0-9a-f]{6}$/i.test(d.acento || '') ? d.acento.toUpperCase() : '#D2002E',
        modo: d.modo === 'wix' ? 'wix' : 'vcard', carpeta: folder, imported: true };
      card.publicada = card.modo === 'wix';
      const reg = registry.find((r) => r.carpeta === folder || r.id === folder);
      card.fecha = reg?.fecha || '';
      if (state.cards.some((x) => cardSlug(x) === cardSlug(card))) { skipped++; continue; }
      for (const [key, field] of [['foto', 'fotoDataUri'], ['logo', 'logoDataUri'], ['fondo', 'fondoDataUri']]) {
        if (d[field] && String(d[field]).startsWith('data:image')) { const b = dataUrlToBlob(d[field]); card[key] = await ImageStore.put(b, nombreSubida(`${card.nombre}-${key}`, b.type)); }
      }
      if (card.fondo) card.fondoTipo = 'imagen';
      let co = state.companies.find((x) => x.name.trim().toLowerCase() === card.empresa.trim().toLowerCase());
      if (!co && card.empresa) {
        co = { ...emptyCompany(), name: card.empresa, website: card.web ? normalizeUrl(card.web) : '', address: card.direccion, logo: card.logo,
          colors: { ...DEFAULT_COLORS, primary: card.acento }, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
        await guardarEmpresaRemota(co);
        state.companies.push(co);
        companiesCreated++;
      }
      if (co) {
        card.companyId = co.id;
        if (!co.logo && card.logo) co.logo = card.logo;
        const exists = (co.people || []).find((p) => [p.firstName, p.lastName].filter(Boolean).join(' ').toLowerCase() === card.nombre.toLowerCase());
        if (exists) card.personId = exists.id;
        else {
          const parts = card.nombre.trim().split(/\s+/);
          const person = { id: uid('p'), firstName: parts.length > 2 ? parts.slice(0, -2).join(' ') : parts[0], lastName: parts.length > 2 ? parts.slice(-2).join(' ') : parts.slice(1).join(' '),
            jobTitle: card.cargo, email: card.correo, phone: card.telefono, whatsapp: '', photo: card.foto };
          co.people = [...(co.people || []), person];
          card.personId = person.id;
          tocadas.add(co);
        }
      }
      const record = { ...card, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      await guardarTarjetaRemota(record);
      state.cards.push(record);
      added++;
    } catch { errores++; }
  }
  for (const co of tocadas) await guardarEmpresaRemota(co).catch(() => { errores++; });
  guardando = false;
  saveState();
  renderCards();
  toast(`Importadas ${added} tarjetas${skipped ? `, ${skipped} ya existían` : ''}${errores ? `, ${errores} con error` : ''}${companiesCreated ? `. Empresas nuevas: ${companiesCreated}` : ''}.`, errores ? 'error' : undefined);
}

async function handleCardAction(action, el) {
  const id = el.dataset.id;
  const card = id ? (state.cards || []).find((x) => x.id === id) : null;
  const run = async (label, fn) => {
    const old = el.innerHTML; el.disabled = true;
    try { await fn(); } catch { toast(`No se pudo generar ${label}.`, 'error'); } finally { el.disabled = false; el.innerHTML = old; }
  };
  switch (action) {
    case 'card-new': cardDraft = emptyCard(); cardErrors = {}; cardTab = 'arte'; renderCards(); break;
    case 'card-edit': if (card) { cardDraft = clone(card); cardErrors = {}; cardTab = 'arte'; renderCards(); } break;
    case 'card-cancel': cardDraft = null; cardErrors = {}; renderCards(); break;
    case 'card-toggle-group': { const g = el.dataset.group; if (openCardGroups.has(g)) openCardGroups.delete(g); else openCardGroups.add(g); if (!openCardGroups.size) openCardGroups.add('__none__'); renderCards(); break; }
    case 'card-copy-url': if (card) copyText(cardUrl(card)); break;
    case 'card-duplicate':
      if (card) { cardDraft = { ...clone(card), id: uid('card'), nombre: '', cargo: '', telefono: '', correo: '', foto: null, personId: null, publicada: false, imported: false, slugPublico: undefined, _wixId: undefined }; cardErrors = {}; renderCards(); toast('Copia lista: completa los datos de la otra persona.'); }
      break;
    case 'card-ask-delete':
      if (card) openDialog(`<div class="dlg-head"><div><p class="eyebrow">Eliminar tarjeta</p><h2 id="dlg-title">¿Eliminar la tarjeta de ${esc(card.nombre)}?</h2></div></div>
        <p>Se borra de Wix: <b>su página deja de existir y los QR impresos que apuntan a ella dejarán de funcionar.</b> Descarga el paquete .zip antes si quieres conservarla. Tu carpeta en OneDrive no se modifica.</p>
        <div class="dlg-foot"><button class="btn" data-action="close-dialog">Cancelar</button><button class="btn btn-danger" data-action="card-confirm-delete" data-id="${card.id}">${icon('trash')}Eliminar</button></div>`);
      break;
    case 'card-confirm-delete':
      if (!card) break;
      el.disabled = true;
      conWix(() => Remoto.llamar('eliminarTarjeta', cardSlug(card)), 'No se pudo eliminar la tarjeta.').then((ok) => {
        closeDialog();
        if (!ok) return;
        state.cards = state.cards.filter((x) => x.id !== id); saveState(); renderCards(); toast('Tarjeta eliminada.');
      });
      break;
    case 'card-img-set': cardDraft[el.dataset.key] = el.dataset.ref || null; renderCardEditor(); break;
    case 'card-grad': { const co = findCompany(cardDraft.companyId); const g = co?.gradients?.[Number(el.dataset.idx)]; if (g) { cardDraft.gradiente = clone(g); redrawCardPreview(); } break; }
    case 'card-dl-art': if (card) await run('el arte', async () => saveFile(`${slugify(cardFolder(card))}-arte.png`, await cardArtBlob(card))); break;
    case 'card-dl-zip': if (card) await run('el paquete', async () => saveFile(`${slugify(cardFolder(card))}.zip`, await makeZip(await cardEntries(card, `${cardFolder(card)}/`)))); break;
    case 'card-dl-art-draft': await run('el arte', async () => saveFile(`${slugify(cardFolder(cardDraft))}-arte.png`, await cardArtBlob(cardDraft))); break;
    case 'card-dl-qr-draft': await run('el QR', async () => saveFile(`${slugify(cardFolder(cardDraft))}-qr.png`, await cardQrBlob(cardDraft))); break;
    case 'card-dl-zip-draft': await run('el paquete', async () => saveFile(`${slugify(cardFolder(cardDraft))}.zip`, await makeZip(await cardEntries(cardDraft, `${cardFolder(cardDraft)}/`)))); break;
    case 'card-export-all':
      await run('el respaldo', async () => {
        const entries = [];
        for (const c of state.cards || []) entries.push(...(await cardEntries(c, `Tarjetas/${cardFolder(c)}/`)));
        entries.push({ name: 'Tarjetas/registro.json', data: JSON.stringify((state.cards || []).map(cardRegistryEntry), null, 2) });
        await saveFile(`tarjetas-ozmk-${dayKey(today())}.zip`, await makeZip(entries));
      });
      break;
    default: break;
  }
}
