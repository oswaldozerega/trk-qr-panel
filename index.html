/* ───────────────────────── Events ───────────────────────── */

function detectDevice() {
  const ua = navigator.userAgent;
  if (/iPad/.test(ua)) return 'iPad';
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? 'Android' : 'Tablet';
  if (/Windows/.test(ua)) return 'Windows';
  if (/Macintosh/.test(ua)) return 'Mac';
  if (/Linux/.test(ua)) return 'Linux';
  return 'Otros';
}

function findCode(id) { return state.codes.find((c) => c.id === id); }

function refreshAfterImage(path) {
  if (path.startsWith('co.')) { renderCompanyEditor(); return; }
  if (path.startsWith('draft.data.')) rerenderTypeFields();
  else rerenderPageControls();
  rerenderDesignControls();
  updatePreview();
}

async function handleImageUpload(input) {
  const path = input.dataset.imgUpload;
  const kind = input.dataset.imgKind;
  const multi = input.dataset.imgMulti === '1';
  const files = Array.from(input.files || []);
  if (!files.length) return;
  try {
    const ids = [];
    state.imageMeta = state.imageMeta || {};
    toast(files.length > 1 ? `Subiendo ${files.length} imágenes a Wix…` : 'Subiendo imagen a Wix…');
    for (const f of files) {
      const r = await processImage(f, kind);
      const id = await ImageStore.put(r.blob, nombreSubida(f.name, r.blob.type));
      state.imageMeta[id] = { ow: r.ow, oh: r.oh, w: r.w, h: r.h };
      ids.push(id);
    }
    saveState();
    if (multi) {
      const list = getPath(path) || [];
      const category = input.dataset.imgCat || 'otro';
      setPath(path, path === 'co.gallery'
        ? [...list, ...ids.map((img) => ({ img, caption: '', category, sub: category === 'local' ? 'fachada' : '', price: '' }))]
        : [...list, ...ids]);
    } else {
      setPath(path, ids[0]);
    }
    refreshAfterImage(path);
    toast(ids.length > 1 ? `${ids.length} fotos agregadas. Recuerda guardar.` : 'Imagen cargada. Recuerda guardar.');
  } catch (err) {
    toast(err && err.message === 'not-image' ? 'Ese archivo no es una imagen. Prueba con un JPG o PNG.' : `No se pudo subir la imagen. ${err?.message || ''}`, 'error');
  }
}

/* Nombre legible para la biblioteca de medios: "foto.jpg" → "oz-qr-foto.jpg" con la extensión del tipo final. */
function nombreSubida(nombre, tipo) {
  const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'image/svg+xml': 'svg', 'application/pdf': 'pdf' }[tipo];
  const base = slugify(String(nombre || 'archivo').replace(/\.[a-z0-9]+$/i, '')) || 'archivo';
  return `oz-qr-${base}${ext ? `.${ext}` : (String(nombre).match(/\.[a-z0-9]+$/i)?.[0] || '')}`;
}

async function exportBackup() {
  const { events, scanTotals, imageMeta, ...datos } = state;
  const payload = { app: 'oz-qr-code-generator', version: APP_VERSION, exportedAt: new Date().toISOString(), ...datos, images: {} };
  saveFile(`oz-qr-respaldo-${dayKey(today())}.json`, new Blob([JSON.stringify(payload)], { type: 'application/json' }));
}

/* Trae a Wix un respaldo del prototipo: sube sus imágenes (ids de IndexedDB → URL de Wix) y guarda
   empresas, códigos y tarjetas. No reemplaza registros que ya existen (mismo id, enlace corto o tarjeta). */
async function importBackup(file) {
  if (guardando) return;
  const progreso = (t) => { const p = $('#import-progress'); if (p) p.textContent = t; };
  let data;
  try { data = JSON.parse(await file.text()); if (!Array.isArray(data.codes)) throw new Error('invalid'); }
  catch { toast('Ese archivo no es un respaldo válido del panel.', 'error'); return; }
  guardando = true;
  const urls = new Map();
  const res = { co: 0, qr: 0, card: 0, omitidos: 0, errores: 0 };
  try {
    const imgs = Object.entries(data.images || {});
    for (let k = 0; k < imgs.length; k++) {
      progreso(`Subiendo imágenes ${k + 1} de ${imgs.length}…`);
      try { const blob = dataUrlToBlob(imgs[k][1]); urls.set(imgs[k][0], await ImageStore.put(blob, nombreSubida('importada', blob.type))); } catch { res.errores++; }
    }
    const fix = (v) => {
      if (typeof v === 'string') return urls.has(v) ? urls.get(v) : v;
      if (Array.isArray(v)) return v.map(fix);
      if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([key, x]) => [key, fix(x)]));
      return v;
    };
    const m = fix(migrateState(data));
    for (const co of m.companies) {
      progreso(`Guardando empresa ${co.name}…`);
      if (state.companies.some((x) => x.id === co.id || x.name.trim().toLowerCase() === co.name.trim().toLowerCase())) { res.omitidos++; continue; }
      try { await guardarEmpresaRemota(co); state.companies.push(co); res.co++; } catch { res.errores++; }
    }
    for (const c of m.codes) {
      progreso(`Guardando código ${c.title}…`);
      if (state.codes.some((x) => x.slug === c.slug)) { res.omitidos++; continue; }
      const code = codigoDesdeWix({ ...c, estado: c.status });
      try { await guardarCodigoRemoto(code); state.codes.push(code); res.qr++; } catch { res.errores++; }
    }
    for (const card of m.cards) {
      progreso(`Publicando tarjeta de ${card.nombre}…`);
      if (state.cards.some((x) => cardSlug(x) === cardSlug(card))) { res.omitidos++; continue; }
      try { await guardarTarjetaRemota(card); state.cards.push(card); res.card++; } catch { res.errores++; }
    }
  } finally { guardando = false; }
  state.codes.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  saveState(); weightCache.clear(); thumbCache.clear(); coDraft = null; draft = null;
  progreso('');
  render();
  toast(`Importado a Wix: ${res.qr} códigos, ${res.co} empresas y ${res.card} tarjetas${res.omitidos ? `. ${res.omitidos} ya existían` : ''}${res.errores ? `. ${res.errores} con error` : ''}.`, res.errores ? 'error' : undefined);
}

function hoursDay(k) {
  const h = coDraft.hours;
  h.days = h.days || emptyHours().days;
  h.days[k] = h.days[k] || dayHours('closed');
  h.days[k].ranges = h.days[k].ranges || [];
  return h.days[k];
}
function updateHoursSummary() {
  const el = $('#hours-summary');
  if (el) el.textContent = hoursSummary(coDraft.hours, coDraft.hoursNote) || 'Sin horario visible';
  refreshCoPreview();
}
function rerenderHours() { const box = $('#hours-box'); if (box) box.innerHTML = hoursEditor(); updateHoursSummary(); }

/* Gradients live at a path in the draft (page cover/background) or the company (its saved gradients). */
function updateGradient(path, mutate, rerender = false) {
  const fallback = path.startsWith('draft.page.') ? pageOf(draft)[path.split('.').pop()] : null;
  const g = clone(getPath(path) || fallback || newGradient(['#D2002E', '#92001F']));
  mutate(g);
  setPath(path, g);
  if (rerender) {
    if (path.startsWith('co.')) renderCompanyEditor(); else rerenderPageControls();
  } else {
    const pv = $(`[data-grad-preview="${path}"]`);
    if (pv) pv.style.background = gradientCss(g);
  }
  if (path.startsWith('co.')) refreshCoPreview(); else updatePreviewSoon();
}

const LOCATION_FIELDS = ['address', 'number', 'crossStreet', 'neighborhood', 'buildingName', 'unit', 'city', 'state', 'country', 'name'];

function handleAction(action, el) {
  const id = el.dataset.id;
  const code = id ? findCode(id) : null;
  switch (action) {
    case 'toggle-sidebar': collapsed = !collapsed; writeStorage('oz-sidebar', collapsed ? 'collapsed' : 'expanded'); applySidebar(); if (currentView === 'analytics') setTimeout(drawTrend, 280); break;
    case 'open-nav': $('#app').classList.add('nav-open'); $('.nav-btn')?.focus(); break;
    case 'close-nav': $('#app').classList.remove('nav-open'); break;
    case 'close-dialog': closeDialog(); break;
    case 'edit': closeDialog(); go('create', { editId: id }); break;
    case 'preview': if (code) openPreview(code); break;
    case 'download': if (code) { closeDialog(); openDownload(code); } break;
    case 'stats': anFilter.target = `code:${id}`; go('analytics'); break;
    case 'menu': if (code) openRowMenu(el, code); break;
    case 'pause':
      if (code) {
        closeMenu();
        const next = { ...clone(code), status: 'paused', pauses: [...(code.pauses || []), { from: new Date().toISOString(), to: null }], updatedAt: new Date().toISOString() };
        conWix(() => guardarCodigoRemoto(next), 'No se pudo pausar.').then((ok) => { if (ok) { Object.assign(code, next); saveState(); render(); toast(`"${code.title}" está en pausa.`); } });
      }
      break;
    case 'resume':
      if (code) {
        closeMenu();
        const next = { ...clone(code), status: 'active', updatedAt: new Date().toISOString() };
        const open = (next.pauses || []).find((p) => !p.to); if (open) open.to = new Date().toISOString();
        conWix(() => guardarCodigoRemoto(next), 'No se pudo reactivar.').then((ok) => { if (ok) { Object.assign(code, next); saveState(); render(); toast(`"${code.title}" vuelve a redirigir.`); } });
      }
      break;
    case 'reload-scans':
      el.disabled = true;
      (async () => {
        let aviso = '';
        try { const r = await Remoto.llamar('actualizarUbicaciones'); if (r.pendientes) aviso = ` Quedan ${r.pendientes} por ubicar (se completan cada hora).`; }
        catch (err) { aviso = ` ${err.message}`; }
        const ok = await conWix(() => recargarEscaneos(), 'No se pudieron leer los escaneos.');
        render();
        if (ok) toast(`Escaneos actualizados.${aviso}`, aviso && !aviso.startsWith(' Quedan') ? 'error' : undefined);
      })();
      break;
    case 'copy-link': if (code) { copyText(shortUrl(code)); closeMenu(); } break;
    case 'duplicate':
      if (code) {
        const copy = { ...clone(code), id: uid(), slug: newSlug(), title: `${code.title} (copia)`, demo: false, status: 'active', pauses: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
        delete copy._wixId;
        closeMenu();
        conWix(() => guardarCodigoRemoto(copy), 'No se pudo duplicar.').then((ok) => { if (ok) { state.codes.unshift(copy); saveState(); render(); toast('Código duplicado con un enlace corto nuevo.'); } });
      }
      break;
    case 'ask-delete':
      closeMenu();
      if (code) openDialog(`<div class="dlg-head"><div><p class="eyebrow">Eliminar código</p><h2 id="dlg-title">¿Eliminar "${esc(code.title)}"?</h2></div></div>
        <p>${code.mode === 'dynamic' ? 'El enlace corto dejará de funcionar y los QR impresos mostrarán un aviso de que el código no existe. Sus escaneos quedan guardados en Wix.' : 'Solo se quita del panel. Los QR estáticos ya impresos siguen funcionando porque el contenido está dentro del código.'}</p>
        <div class="dlg-foot"><button class="btn" data-action="close-dialog">Cancelar</button><button class="btn btn-danger" data-action="confirm-delete" data-id="${code.id}">${icon('trash')}Eliminar</button></div>`);
      break;
    case 'confirm-delete':
      if (!code) break;
      el.disabled = true;
      conWix(() => Remoto.llamar('eliminarCodigo', code.slug), 'No se pudo eliminar.').then((ok) => {
        closeDialog();
        if (!ok) return;
        state.codes = state.codes.filter((c) => c.id !== id);
        state.events = state.events.filter((e) => e.codeId !== id);
        saveState(); render(); toast('Código eliminado.');
      });
      break;
    case 'clear-filters': Object.assign(codesFilter, { q: '', status: 'all', type: 'all', client: 'all' }); renderCodes(); break;
    case 'copy-payload': copyText(qrPayload(draft)); break;
    case 'download-draft': {
      const errs = draft.mode === 'static' ? validateDraft() : {};
      if (errs._payload) { toast(errs._payload, 'error'); break; }
      downloadCode(draft);
      break;
    }
    case 'cancel-edit': draft = null; editingId = null; go('codes'); break;
    case 'add-row': {
      const list = el.dataset.list;
      draft.data[list] = [...(draft.data[list] || []), list === 'links' ? { icon: 'web', label: '', url: '' } : { network: 'instagram', label: '', url: '' }];
      rerenderTypeFields(); updatePreviewSoon(); break;
    }
    case 'remove-row': {
      const list = el.dataset.list;
      draft.data[list] = (draft.data[list] || []).filter((_, i) => i !== Number(el.dataset.idx));
      rerenderTypeFields(); updatePreviewSoon(); break;
    }
    case 'remove-file':
      draft.data.files = (draft.data.files || []).filter((_, i) => i !== Number(el.dataset.idx));
      rerenderTypeFields(); updatePreviewSoon(); break;
    case 'apply-brand': {
      const co = draftCompany();
      if (co) { applyBrand(co); rerenderPageControls(); rerenderDesignControls(); updatePreview(); toast(`Marca de ${co.name} aplicada.`); }
      break;
    }
    case 'img-set': setPath(el.dataset.path, el.dataset.ref || null); refreshAfterImage(el.dataset.path); break;
    case 'gallery-remove': {
      const path = el.dataset.path;
      setPath(path, (getPath(path) || []).filter((_, i) => i !== Number(el.dataset.idx)));
      refreshAfterImage(path);
      break;
    }
    case 'gallery-from-company': {
      const co = draftCompany();
      const path = el.dataset.path;
      const current = getPath(path) || [];
      setPath(path, [...current, ...(co?.gallery || []).map((g) => g.img).filter((r) => !current.includes(r))]);
      refreshAfterImage(path);
      break;
    }
    case 'co-new': coDraft = emptyCompany(); coErrors = {}; coReturn = null; go('companies', { keepCompany: true }); break;
    case 'co-new-from-create': coDraft = emptyCompany(); coErrors = {}; coReturn = 'create'; go('companies', { keepCompany: true }); break;
    case 'co-edit': { const co = findCompany(id); if (co) { coDraft = clone(co); coErrors = {}; coReturn = null; go('companies', { keepCompany: true }); } break; }
    case 'co-new-qr': go('create', { companyId: id }); break;
    case 'co-cancel': {
      const back = coReturn;
      coDraft = null; coErrors = {}; coReturn = null;
      if (back === 'create' && draft) go('create', { keepDraft: true }); else renderCompanies();
      break;
    }
    case 'co-row-add': {
      const list = el.dataset.list;
      const c = { ...DEFAULT_COLORS, ...coDraft.colors };
      const rows = {
        socials: () => ({ network: 'instagram', label: '', url: '' }),
        people: () => ({ id: uid('p'), firstName: '', lastName: '', jobTitle: '', email: '', phone: '', whatsapp: '', photo: null }),
        extraColors: () => ({ name: '', hex: '#FFCD00' }),
        gradients: () => ({ ...newGradient([c.primary, c.secondary]), name: `Degradado ${(coDraft.gradients || []).length + 1}` })
      };
      coDraft[list] = [...(coDraft[list] || []), rows[list]()];
      renderCompanyEditor();
      refreshCoPreview();
      break;
    }
    case 'co-jump': $(`#sec-${el.dataset.target}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'co-view-codes': { const co = findCompany(id); if (co) { Object.assign(codesFilter, { client: co.name, status: 'all', q: '', type: 'all' }); go('codes'); } break; }
    case 'co-create-type': saveCompany({ type: coPreviewType }); break;
    case 'hours-add-range': {
      const d = hoursDay(el.dataset.day);
      const last = d.ranges[d.ranges.length - 1];
      d.ranges.push({ from: last?.to && last.to < '15:00' ? '15:00' : (last?.to || '15:00'), to: '19:00' });
      rerenderHours();
      break;
    }
    case 'hours-remove-range': { const d = hoursDay(el.dataset.day); d.ranges.splice(Number(el.dataset.range), 1); rerenderHours(); break; }
    case 'hours-copy': {
      const mon = clone(hoursDay('mon'));
      const targets = el.dataset.target === 'all' ? WEEK.map(([k]) => k).filter((k) => k !== 'mon') : ['tue', 'wed', 'thu', 'fri'];
      for (const k of targets) coDraft.hours.days[k] = clone(mon);
      rerenderHours();
      toast('Horario copiado.');
      break;
    }
    case 'grad-add-stop': updateGradient(el.dataset.path, (g) => { g.colors.push(g.colors[g.colors.length - 1] || '#FFFFFF'); }, true); break;
    case 'grad-remove-stop': updateGradient(el.dataset.path, (g) => { g.colors.splice(Number(el.dataset.stop), 1); }, true); break;
    case 'grad-apply': {
      const co = draftCompany();
      const g = co?.gradients?.[Number(el.dataset.idx)];
      if (!g) break;
      setPath(el.dataset.target, clone(g));
      if (el.dataset.target.endsWith('bgGradient')) draft.page.bgType = 'gradient';
      if (el.dataset.target.endsWith('coverGradient')) draft.page.coverType = 'gradient';
      rerenderPageControls(); updatePreview();
      break;
    }
    case 'co-row-remove': {
      const list = el.dataset.list;
      coDraft[list] = (coDraft[list] || []).filter((_, i) => i !== Number(el.dataset.idx));
      renderCompanyEditor();
      break;
    }
    case 'co-ask-delete': {
      const co = findCompany(id);
      if (!co) break;
      const n = codesOfCompany(id).length;
      openDialog(`<div class="dlg-head"><div><p class="eyebrow">Eliminar empresa</p><h2 id="dlg-title">¿Eliminar "${esc(co.name)}"?</h2></div></div>
        <p>${n ? `Sus ${n} códigos QR no se borran: siguen funcionando y quedan sin empresa asignada.` : 'No tiene códigos QR asociados.'} Se pierden sus datos, personas y fotos.</p>
        <div class="dlg-foot"><button class="btn" data-action="close-dialog">Cancelar</button><button class="btn btn-danger" data-action="co-confirm-delete" data-id="${co.id}">${icon('trash')}Eliminar</button></div>`);
      break;
    }
    case 'co-confirm-delete':
      el.disabled = true;
      conWix(async () => {
        await Remoto.llamar('eliminarEmpresa', id);
        for (const c of state.codes.filter((x) => x.companyId === id)) { c.companyId = null; await guardarCodigoRemoto(c).catch(() => {}); }
      }, 'No se pudo eliminar la empresa.').then((ok) => {
        closeDialog();
        if (!ok) return;
        state.companies = state.companies.filter((c) => c.id !== id);
        saveState(); renderCompanies(); toast('Empresa eliminada.');
      });
      break;
    case 'toggle-devices': showAllDevices = !showAllDevices; renderAnalytics(); break;
    case 'export-csv': {
      const a = computeAnalytics(targetCodes(anFilter.target), anFilter.days);
      saveFile(`analitica-${slugify(targetLabel(anFilter.target))}-${dayKey(today())}.csv`, new Blob([analyticsCSV(a, targetLabel(anFilter.target))], { type: 'text/csv' }));
      break;
    }
    case 'to-report': rptFilter.target = anFilter.target; rptFilter.days = anFilter.days; reportReady = true; go('reports'); break;
    case 'report-pdf': exportReportPDF(el); break;
    case 'report-csv': {
      const a = computeAnalytics(targetCodes(rptFilter.target), rptFilter.days);
      saveFile(`informe-${slugify(targetLabel(rptFilter.target))}-${dayKey(today())}.csv`, new Blob([analyticsCSV(a, targetLabel(rptFilter.target))], { type: 'text/csv' }));
      break;
    }
    case 'backup': exportBackup(); break;
    case 'retry-load': boot(); break;
    case 'forget-key': Clave.clear(); toast('Clave olvidada en este equipo.'); boot(); break;
    default: break;
  }
}

function copyText(text) {
  const done = () => toast('Copiado al portapapeles.');
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  if (ok) done(); else toast(`Copia este texto: ${text}`, 'error');
}

function syncHex(attr, k, value) { const el = $(`[${attr}="${k}"]`); if (el && el.value !== value) el.value = value; }
function normalizeHex(v) { const s = String(v || '').trim(); const h = s.startsWith('#') ? s : `#${s}`; return /^#[0-9a-f]{6}$/i.test(h) ? h.toUpperCase() : null; }

document.addEventListener('click', (e) => {
  if (openMenuFor && !e.target.closest('.menu') && !e.target.closest('[data-action="menu"]')) closeMenu();
  const nav = e.target.closest('[data-nav]');
  if (nav) { go(nav.dataset.nav); return; }
  const themePick = e.target.closest('[data-theme-pick]');
  if (themePick) { setTheme(themePick.dataset.themePick); return; }
  const st = e.target.closest('[data-status-filter]');
  if (st) { codesFilter.status = st.dataset.statusFilter; renderCodes(); return; }
  const typePick = e.target.closest('[data-type-pick]');
  if (typePick) {
    const t = typeById(typePick.dataset.typePick);
    if (t.id !== draft.type) {
      draft.type = t.id;
      draft.data = { ...emptyData(t.id), ...pickShared(draft.data) };
      if (!t.modes.includes(draft.mode)) draft.mode = t.modes[0];
      const co = draftCompany();
      if (co) applyCompany(co);
      draftErrors = {};
      renderCreate();
    }
    return;
  }
  const gradType = e.target.closest('[data-grad-type]');
  if (gradType) { updateGradient(gradType.dataset.gradType, (g) => { g.type = gradType.dataset.value; }, true); return; }
  const hoursMode = e.target.closest('[data-hours-mode]');
  if (hoursMode && coDraft) { coDraft.hours.mode = hoursMode.dataset.hoursMode; if (!coDraft.hours.days) coDraft.hours.days = emptyHours().days; rerenderHours(); return; }
  const pagePick = e.target.closest('[data-page-pick]');
  if (pagePick) {
    draft.page = { ...pageOf(draft), [pagePick.dataset.pagePick]: pagePick.dataset.value };
    rerenderPageControls(); updatePreview();
    return;
  }
  const designPick = e.target.closest('[data-design-pick]');
  if (designPick) {
    const k = designPick.dataset.designPick, v = designPick.dataset.value;
    draft.design[k] = v;
    if (k === 'logo') {
      if (v !== 'none') draft.design.ecl = 'H';
      if (v === 'company') draft.design.logoRef = draftCompany()?.logo || null;
      rerenderDesignControls();
    } else {
      $$(`[data-design-pick="${k}"]`).forEach((b) => b.setAttribute('aria-checked', String(b.dataset.value === v)));
    }
    updatePreview();
    return;
  }
  const preset = e.target.closest('[data-preset]');
  if (preset) {
    if (preset.dataset.preset === 'company') {
      const c = { ...DEFAULT_COLORS, ...(draftCompany()?.colors || {}) };
      Object.assign(draft.design, { fg: contrastRatio(c.text, '#FFFFFF') >= 4 ? c.text : '#141A1F', bg: '#FFFFFF', eye: c.primary });
    } else {
      const p = DESIGN_PRESETS[Number(preset.dataset.preset)];
      Object.assign(draft.design, { fg: p.fg, bg: p.bg, eye: p.eye });
    }
    for (const k of ['fg', 'bg', 'eye']) { $(`#d-${k}`).value = draft.design[k]; syncHex('data-design-hex', k, draft.design[k]); }
    updatePreview();
    return;
  }
  const testPick = e.target.closest('[data-preview-test]');
  if (testPick) { previewTest = testPick.dataset.previewTest === '1'; updatePreview(); return; }
  const tab = e.target.closest('[data-preview-tab]');
  if (tab) { previewTab = tab.dataset.previewTab; $$('[data-preview-tab]').forEach((b) => b.setAttribute('aria-selected', String(b === tab))); updatePreview(); return; }
  const mode = e.target.closest('[data-chart-mode]');
  if (mode) { anFilter.mode = mode.dataset.chartMode; $$('[data-chart-mode]').forEach((b) => b.setAttribute('aria-checked', String(b === mode))); drawTrend(); return; }
  const page = e.target.closest('[data-page]');
  if (page) { const st2 = tables[page.dataset.page]; st2.page = Math.max(0, st2.page + Number(page.dataset.dir)); renderAnalytics(); return; }
  const fmt = e.target.closest('[data-dl-format]');
  if (fmt) {
    dlChoice.format = fmt.dataset.dlFormat;
    $$('[data-dl-format]').forEach((b) => b.setAttribute('aria-checked', String(b === fmt)));
    const submit = $('#download-form button[type="submit"]');
    if (submit) submit.innerHTML = `${icon('download')}Descargar ${dlChoice.format.toUpperCase()}`;
    return;
  }
  const act = e.target.closest('[data-action]');
  if (act) { e.preventDefault(); handleAction(act.dataset.action, act); }
});

/* Fields that make sense across types (title-like and contact data) survive a type switch. */
function pickShared(data) {
  const keep = {};
  for (const k of ['pageTitle', 'phone', 'message']) if (data[k]) keep[k] = data[k];
  return keep;
}

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'codes-search') { codesFilter.q = el.value; const pos = el.selectionStart; renderCodes(); const s = $('#codes-search'); s.focus(); s.setSelectionRange(pos, pos); return; }
  if (el.type === 'file') return;

  if (el.dataset.grad) { updateGradient(el.dataset.grad, (g) => { g.colors[Number(el.dataset.stop)] = el.value.toUpperCase(); }); const t = el.parentElement.querySelector('[data-grad-hex]'); if (t) t.value = el.value.toUpperCase(); return; }
  if (el.dataset.gradHex) {
    const v = normalizeHex(el.value);
    if (v) { updateGradient(el.dataset.gradHex, (g) => { g.colors[Number(el.dataset.stop)] = v; }); const c = el.parentElement.querySelector('[data-grad]'); if (c) c.value = v; }
    return;
  }
  if (el.dataset.gradAngle) {
    updateGradient(el.dataset.gradAngle, (g) => { g.angle = Number(el.value); });
    const lbl = $(`[data-grad-angle-label="${el.dataset.gradAngle}"]`); if (lbl) lbl.textContent = `${el.value}°`;
    return;
  }
  if (el.dataset.gradName) { updateGradient(el.dataset.gradName, (g) => { g.name = el.value; }); return; }

  if (coDraft && currentView === 'companies') {
    if (el.hasAttribute('data-maps-paste')) {
      const r = parseMapsInput(el.value);
      if (r) {
        coDraft.lat = r.lat; coDraft.lng = r.lng;
        const lat = $('#co-lat'), lng = $('#co-lng');
        if (lat) lat.value = r.lat;
        if (lng) lng.value = r.lng;
        refreshMapLinks();
        toast(`Coordenadas cargadas: ${r.lat}, ${r.lng}`);
      } else if (/goo\.gl|maps\.app/i.test(el.value)) {
        toast('Ese es un enlace corto sin coordenadas. Ábrelo y copia la dirección larga del navegador.', 'error');
      }
      return;
    }
    if (el.dataset.hoursDay) {
      const d = hoursDay(el.dataset.hoursDay);
      const field = el.dataset.hoursField;
      if (field === 'status') {
        d.status = el.value;
        if (d.status === 'open' && !d.ranges.length) d.ranges = [{ from: '09:00', to: '18:00' }];
        rerenderHours();
      } else {
        const r = d.ranges[Number(el.dataset.range)];
        if (r) r[field] = el.value;
        updateHoursSummary();
      }
      return;
    }
    if (el.dataset.co) {
      setPath(`co.${el.dataset.co}`, el.value);
      if (coErrors[el.dataset.co]) { delete coErrors[el.dataset.co]; el.removeAttribute('aria-invalid'); el.parentElement.querySelector('.err')?.remove(); }
      if (el.dataset.co === 'hoursNote') updateHoursSummary();
      if (LOCATION_FIELDS.includes(el.dataset.co) || el.dataset.co === 'lat' || el.dataset.co === 'lng') refreshMapLinks();
      refreshCoPreview();
      return;
    }
    if (el.dataset.coList) {
      const row = coDraft[el.dataset.coList]?.[Number(el.dataset.idx)];
      if (!row) return;
      if (el.dataset.key === 'hex') {
        const v = normalizeHex(el.value);
        if (!v) return;
        row.hex = v;
        el.closest('.list-row')?.querySelectorAll('[data-key="hex"]').forEach((other) => { if (other !== el) other.value = other.type === 'color' ? v.toLowerCase() : v; });
      } else {
        row[el.dataset.key] = el.value;
      }
      if (el.dataset.coList === 'gallery' && el.dataset.key === 'category') { renderCompanyEditor(); return; }
      refreshCoPreview();
      return;
    }
    if (el.dataset.coColor) {
      const k = el.dataset.coColor;
      coDraft.colors[k] = el.value.toUpperCase();
      syncHex('data-co-hex', k, coDraft.colors[k]);
      refreshCoPreview();
      return;
    }
    if (el.dataset.coHex) {
      const v = normalizeHex(el.value);
      if (v) { coDraft.colors[el.dataset.coHex] = v; $(`#cc-${el.dataset.coHex}`).value = v; refreshCoPreview(); }
      return;
    }
    return;
  }

  if (!draft || currentView !== 'create') return;
  if (el.dataset.field) {
    if (el.dataset.scope === 'meta') draft[el.dataset.field] = el.value;
    else draft.data[el.dataset.field] = el.value;
    if (draftErrors[el.dataset.field]) { delete draftErrors[el.dataset.field]; el.removeAttribute('aria-invalid'); el.parentElement.querySelector('.err')?.remove(); }
    updatePreviewSoon();
    return;
  }
  if (el.dataset.list) {
    const row = (draft.data[el.dataset.list] || [])[Number(el.dataset.idx)];
    if (row) row[el.dataset.key] = el.value;
    if (el.tagName === 'SELECT') rerenderTypeFields();
    updatePreviewSoon();
    return;
  }
  if (el.dataset.pageColor) {
    const k = el.dataset.pageColor;
    draft.page = { ...pageOf(draft), [k]: el.value.toUpperCase() };
    syncHex('data-page-hex', k, draft.page[k]);
    updatePreviewSoon();
    return;
  }
  if (el.dataset.pageHex) {
    const v = normalizeHex(el.value);
    if (v) { draft.page = { ...pageOf(draft), [el.dataset.pageHex]: v }; $(`#p-${el.dataset.pageHex}`).value = v; updatePreviewSoon(); }
    return;
  }
  if (el.dataset.design) {
    const k = el.dataset.design;
    draft.design[k] = k === 'margin' ? Number(el.value) : el.value.toUpperCase();
    if (k === 'margin') $('#margin-val').textContent = el.value;
    else syncHex('data-design-hex', k, draft.design[k]);
    updatePreviewSoon();
    return;
  }
  if (el.dataset.designHex) {
    const v = normalizeHex(el.value);
    if (v) { draft.design[el.dataset.designHex] = v; $(`#d-${el.dataset.designHex}`).value = v; updatePreviewSoon(); }
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.imgUpload) { handleImageUpload(el); return; }
  if (el.dataset.filter) { codesFilter[el.dataset.filter] = el.value; renderCodes(); return; }
  if (el.dataset.an) { anFilter[el.dataset.an] = el.dataset.an === 'days' ? Number(el.value) : el.value; tables.cities.page = 0; tables.countries.page = 0; renderAnalytics(); return; }
  if (el.dataset.pageSize) { const st = tables[el.dataset.pageSize]; st.size = Number(el.value); st.page = 0; renderAnalytics(); return; }
  if (el.id === 'dl-format') { dlChoice.format = el.value; return; }
  if (el.id === 'dl-size' || el.id === 'dl-size-d') { dlChoice.size = Number(el.value); return; }
  if (el.dataset.coList && el.tagName === 'SELECT' && coDraft) {
    const row = coDraft[el.dataset.coList]?.[Number(el.dataset.idx)];
    if (row) row[el.dataset.key] = el.value;
    if (el.dataset.coList === 'socials') renderCompanyEditor();
    return;
  }
  if (el.hasAttribute('data-co-preview-type')) {
    coPreviewType = el.value;
    const box = $('#co-preview');
    if (box && coDraft) box.innerHTML = companyPreview();
    return;
  }
  if (!draft) {
    if (el.id === 'restore-file' && el.files?.[0]) importBackup(el.files[0]);
    return;
  }
  if (el.hasAttribute('data-company-pick')) {
    const co = findCompany(el.value);
    if (co) { applyCompany(co, { brand: true }); toast(`Datos de ${co.name} cargados.`); }
    else { draft.companyId = null; draft.client = ''; draft.personId = null; }
    renderCreate();
    return;
  }
  if (el.hasAttribute('data-person-pick')) { applyPerson(draftCompany(), el.value); renderCreate(); return; }
  if (el.dataset.pageCheck) { draft.page = { ...pageOf(draft), [el.dataset.pageCheck]: el.checked }; updatePreview(); return; }
  if (el.name === 'mode') { draft.mode = el.value; renderCreate(); return; }
  if (el.name === 'lang') { draft.lang = pubLang(el.value); renderCreate(); return; }
  if (el.dataset.fileKind) {
    const elegidos = Array.from(el.files || []);
    if (!elegidos.length) return;
    const single = el.dataset.fileKind === 'single';
    if (single && elegidos[0].type && elegidos[0].type !== 'application/pdf') { toast('Ese archivo no es un PDF.', 'error'); return; }
    const grande = elegidos.find((f) => f.size > 50 * 1024 * 1024);
    if (grande) { toast(`${grande.name} pesa más de 50 MB.`, 'error'); return; }
    const campo = el.dataset.field;
    el.disabled = true;
    toast(elegidos.length > 1 ? `Subiendo ${elegidos.length} archivos a Wix…` : `Subiendo ${elegidos[0].name} a Wix…`);
    (async () => {
      const subidos = [];
      for (const f of elegidos) subidos.push({ name: f.name, size: f.size, type: f.type, url: await ImageStore.put(f, nombreSubida(f.name, f.type)) });
      return subidos;
    })().then((subidos) => {
      if (!draft) return;
      if (single) draft.data.file = subidos[0]; else draft.data.files = [...(draft.data.files || []), ...subidos];
      delete draftErrors[campo];
      rerenderTypeFields(); updatePreviewSoon();
      toast('Archivo subido. Recuerda guardar el código.');
    }).catch((err) => { el.disabled = false; toast(`No se pudo subir el archivo. ${err?.message || ''}`, 'error'); });
    return;
  }
  if (el.id === 'logo-upload') {
    const file = el.files?.[0];
    if (!file) return;
    processImage(file, 'logo').then((r) => blobToDataUrl(r.blob)).then((du) => {
      draft.design.logoData = du;
      updatePreview();
      toast('Logo cargado.');
    }).catch(() => toast('No se pudo leer esa imagen. Prueba con un PNG o JPG.', 'error'));
    return;
  }
  if (el.id === 'restore-file' && el.files?.[0]) importBackup(el.files[0]);
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target;
  if (form.id === 'key-form') {
    const fd = new FormData(form);
    Clave.set(String(fd.get('clave') || '').trim(), fd.get('recordar') === 'on');
    boot();
    return;
  }
  if (form.id === 'content-form') { saveDraft(); return; }
  if (form.id === 'company-form') { saveCompany(); return; }
  if (form.id === 'download-form') { const code = findCode(form.querySelector('[type="submit"]').dataset.id); closeDialog(); if (code) downloadCode(code); return; }
  if (form.id === 'report-form') {
    const fd = new FormData(form);
    Object.assign(rptFilter, { target: fd.get('target'), days: Number(fd.get('days')), name: String(fd.get('name') || ''), notes: String(fd.get('notes') || '') });
    reportReady = true;
    renderReports();
    $('#report-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (form.id === 'settings-form') {
    let v = String(new FormData(form).get('shortBase') || '').trim().replace(/^https?:\/\//i, '');
    if (v && !v.endsWith('/')) v += '/';
    if (!/^[a-z0-9.-]+\.[a-z]{2,}(\/[a-z0-9._-]+)*\/$/i.test(v)) {
      const input = $('#s-base');
      input.setAttribute('aria-invalid', 'true');
      toast('Escribe un dominio y ruta como theroofingknight.com/q/', 'error');
      input.focus();
      return;
    }
    renderSettings();
  }
});

document.addEventListener('pointermove', (e) => { if (currentView === 'analytics') onChartHover(e); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeMenu(); $('#app').classList.remove('nav-open'); }
});
window.addEventListener('resize', debounce(() => { if (currentView === 'analytics') drawTrend(); }, 150));
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== currentView && NAV.some((n) => n.id === v)) go(v); });

/* ───────────────────────── Boot ───────────────────────── */

$('#version-label').textContent = `v${APP_VERSION}`;
$('#menu-btn').innerHTML = icon('menu');
applyTheme();
applySidebar();
const initial = location.hash.slice(1);
currentView = NAV.some((n) => n.id === initial) ? initial : 'codes';
renderNav();
function renderClave(error) {
  $('#view').innerHTML = `<div class="glass panel"><form class="empty form-stack" id="key-form" style="max-width:420px;margin:0 auto">
      ${icon('settings')}<h3>Clave de acceso</h3>
      <p>Escribe la clave del panel (secreto <b>TRK_PANEL_KEY</b> del sitio Wix).</p>
      <input class="input" type="password" name="clave" id="key-input" autocomplete="current-password" required minlength="12" aria-label="Clave de acceso"${error ? ' aria-invalid="true"' : ''}>
      ${error ? `<p style="color:var(--danger)">${esc(error)}</p>` : ''}
      <label style="display:flex;gap:8px;align-items:center;justify-content:center"><input type="checkbox" name="recordar" checked> Recordar en este equipo</label>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form></div>`;
  $('#key-input').focus();
}

/* Carga todo desde Wix. Fuera de la página privada del sitio no hay datos: se muestra cómo abrirlo. */
async function boot() {
  if (Remoto.enWix && !Clave.get()) { renderClave(); return; }
  $('#view').innerHTML = '<div class="glass panel"><div class="empty">' + icon('grid') + '<h3>Cargando desde Wix…</h3><p>Códigos, empresas, tarjetas y escaneos.</p></div></div>';
  try {
    await cargarDesdeWix();
  } catch (err) {
    if (ES_CLAVE_INVALIDA.test(err?.message || '')) { Clave.clear(); renderClave('Clave de acceso incorrecta.'); return; }
    $('#view').innerHTML = `<div class="glass panel"><div class="empty">${icon('alert')}<h3>No se pudo conectar con Wix</h3>
      <p>${esc(err?.message || 'Error desconocido.')}</p>
      <p class="muted">El panel solo funciona dentro de la página privada del sitio: <b>${esc(PANEL_URL)}</b>.</p>
      ${Remoto.enWix ? '<button class="btn btn-primary" data-action="retry-load">Reintentar</button>' : ''}</div></div>`;
    return;
  }
  if (currentView === 'create') startDraft(null);
  render();
}
boot();
</script>
